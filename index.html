html{-webkit-text-size-adjust:100%;background:var(--olive-deep)}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
.sync{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--on-band)}

/* Layout: appli de cuisine provençale — bandeau olive avec la carte « Ce soir » qui le chevauche, assiettes illustrées, cartes colorées par protéine, navigation flottante en bas */
:root{
  --bg:#F2F4EA; --surface:#FFFFFF; --sunk:#EAEEDF; --line:#DDE3CF;
  --ink:#1E2619; --muted:#667058;
  --olive:#44612A; --olive-deep:#2E4720; --olive-soft:#E1EAD0; --on-band:#F4F7EC;
  --saffron:#E39A2D; --saffron-soft:#FCEFD6; --tomato:#D4472E; --tomato-soft:#FBE1DA; --sky:#2F78A2; --sky-soft:#DCEBF3;
  --plate:#FFFFFF; --plate-rim:#EEEFE8; --shadow:0 8px 24px rgba(40,55,25,.10); --shadow-s:0 2px 8px rgba(40,55,25,.08);
  --g-vege:linear-gradient(140deg,#E6F1D6,#CFE4B5); --g-poisson:linear-gradient(140deg,#E0EFF7,#C2DEEE);
  --g-volaille:linear-gradient(140deg,#FDF1D6,#F7D99F); --g-viande:linear-gradient(140deg,#FCE6DF,#F4C3B4);
  --g-oeufs:linear-gradient(140deg,#FBF6D6,#F1E59C); --g-none:linear-gradient(140deg,#F1F3EA,#E6EADB);
  --display:"Fredoka", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12160F; --surface:#1B2117; --sunk:#242C1F; --line:#333D2C; --ink:#ECF0E4; --muted:#A3AD95;
  --olive:#A3CB74; --olive-deep:#1C2B12; --olive-soft:#263420; --on-band:#EEF3E4;
  --saffron:#F2B653; --saffron-soft:#3A2E17; --tomato:#F07D66; --tomato-soft:#3C221C; --sky:#83BEDF; --sky-soft:#1C2E38;
  --plate:#EDEFE6; --plate-rim:#D6DACB; --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3);
  --g-vege:linear-gradient(140deg,#24331B,#2E4222); --g-poisson:linear-gradient(140deg,#1B2D37,#213A47);
  --g-volaille:linear-gradient(140deg,#382B15,#47361A); --g-viande:linear-gradient(140deg,#3A211B,#4A2A22);
  --g-oeufs:linear-gradient(140deg,#333015,#423D1A); --g-none:linear-gradient(140deg,#20271B,#262E20); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1B2117; --sunk:#242C1F; --line:#333D2C; --ink:#ECF0E4; --muted:#A3AD95;
  --olive:#A3CB74; --olive-deep:#1C2B12; --olive-soft:#263420; --on-band:#EEF3E4;
  --saffron:#F2B653; --saffron-soft:#3A2E17; --tomato:#F07D66; --tomato-soft:#3C221C; --sky:#83BEDF; --sky-soft:#1C2E38;

  --g-vege:linear-gradient(140deg,#24331B,#2E4222); --g-poisson:linear-gradient(140deg,#1B2D37,#213A47);

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:0 170px;padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--olive-deep)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
.emo{font-family:var(--emoji);line-height:1}

/* Bandeau */
.band{background:var(--olive-deep);color:var(--on-band);position:relative;overflow:hidden;padding-block:22px 64px}
.band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);background-size:18px 18px}
.band::after{content:"🫒";font-family:var(--emoji);position:absolute;right:-18px;top:-10px;font-size:150px;opacity:.13;transform:rotate(-18deg)}
.band .wrap{position:relative;z-index:1}
.band .kicker{font-size:13px;font-weight:700;opacity:.8;letter-spacing:.02em}
.band h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,7vw,38px);margin:2px 0 0;letter-spacing:-.01em;line-height:1.05}
.band h1 span{color:var(--saffron)}
.band.small{padding-block:22px 26px}
main{display:grid;gap:28px;margin-top:-46px;position:relative;z-index:2}
main.flat{margin-top:18px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.lab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}
button,.btn{font:700 14.5px var(--body);border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .12s,background .15s}
button:active{transform:scale(.96)}
.primary{background:var(--olive)!important;border-color:var(--olive)!important;color:var(--surface)!important;box-shadow:0 4px 12px rgba(68,97,42,.28)}
.sun{background:var(--saffron)!important;border-color:var(--saffron)!important;color:#2A1D05!important;box-shadow:0 4px 12px rgba(227,154,45,.32)}
.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.soft{background:var(--sunk);border-color:transparent}
button:disabled{opacity:.45;transform:none}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:110px;line-height:1.5}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}

/* Assiette */
.plate{--s:56px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--s)*.52);line-height:1;
  background:radial-gradient(circle at 50% 50%,var(--plate) 0 58%,var(--plate-rim) 59% 66%,var(--plate) 67% 100%);box-shadow:0 6px 14px rgba(30,40,20,.18),inset 0 -2px 3px rgba(0,0,0,.05)}
.plate.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);font-family:var(--display);color:var(--muted);font-size:calc(var(--s)*.4)}
.t-vege{background:var(--g-vege)}.t-poisson{background:var(--g-poisson)}.t-volaille{background:var(--g-volaille)}.t-viande{background:var(--g-viande)}.t-oeufs{background:var(--g-oeufs)}.t-none{background:var(--g-none)}

/* Ce soir */
.tonight{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.tonight .plate{--s:104px}
.tonight .when{color:var(--saffron);font-weight:800;font-size:13px;letter-spacing:.02em}
.tonight h3{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15;margin:2px 0 8px}
.tonight .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tonight .acts button{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.tm{background:var(--olive-soft);color:var(--olive)}.chip.af{background:var(--saffron-soft);color:#9A6210}.chip.pb{background:var(--sky-soft);color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.af{color:var(--saffron)}}
:root[data-theme="dark"] .chip.af{color:var(--saffron)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* Jours */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.day{position:relative;display:grid;gap:10px;align-content:start;text-align:left;border:0;border-radius:22px;padding:14px;min-height:150px;box-shadow:var(--shadow-s);font-weight:600;justify-content:stretch;color:var(--ink)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);font-weight:700}
.day .dh b{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
.day .dn{font-weight:800;font-size:14.5px;line-height:1.25}
.day.today{outline:3px solid var(--saffron);outline-offset:-3px}
.day .flag{position:absolute;top:-8px;left:14px;background:var(--saffron);color:#2A1D05;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.day .lock{position:absolute;top:12px;right:12px;font-size:13px}
.day.isEmpty .dn{color:var(--muted);font-weight:700}

/* Bilan */
.bilan{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{--p:0;--c:var(--olive);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.ring small{font-size:10.5px;color:var(--muted);font-weight:700}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.dot{border-radius:14px;padding:8px 2px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.dot .emo{font-size:20px;display:block;margin-bottom:2px}
.dot b{font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600;display:block}
.dot.off{box-shadow:inset 0 0 0 2px var(--saffron)}

/* Panier */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pt{position:relative;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-s);display:grid;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.pt.on{border-color:var(--olive);background:var(--olive-soft)}
.pt .main{border:0;background:transparent;display:grid;justify-items:center;gap:6px;padding:12px 4px 8px;font-size:12.5px;font-weight:800;border-radius:0;line-height:1.15}
.pt .main .emo{font-size:34px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);transition:transform .15s}
.pt.on .main .emo{background:var(--surface);transform:scale(1.06)}
.pt .qty{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;padding:0 6px 8px}
.pt .qty button{padding:0;width:30px;height:30px;border-radius:50%;font-size:17px;border:0;background:var(--surface);box-shadow:var(--shadow-s)}
.pt .qty b{text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.pt .use{height:5px;background:var(--surface)}
.pt .use i{display:block;height:100%;background:var(--saffron)}
.pt .use i.full{background:var(--tomato)}
.pt.add .main .emo{background:transparent;border:2px dashed var(--line);font-family:var(--display);color:var(--muted);font-size:26px}

/* Recettes */
.search{position:relative}
.search input{padding-left:44px;border-radius:99px;box-shadow:var(--shadow-s);border-color:transparent}
.search::before{content:"🔎";font-family:var(--emoji);position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pills button{flex:none;border-radius:99px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow-s);border-color:transparent}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.rc{display:grid;grid-template-rows:auto 1fr;padding:0;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-s);overflow:hidden;text-align:left;font-weight:600;justify-content:stretch;align-items:stretch;color:var(--ink)}
.rc:hover{box-shadow:var(--shadow)}
.rc .art{height:112px;display:grid;place-items:center;position:relative}
.rc .art .plate{--s:78px}
.rc .heart{position:absolute;top:10px;right:12px;font-size:18px}
.rc .info{padding:10px 12px 12px;display:grid;gap:7px;align-content:space-between}
.rc .rn{font-weight:800;font-size:14.5px;line-height:1.25}


/* Recettes : collections */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qk{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:20px;border:0;font-size:12px;font-weight:800;box-shadow:var(--shadow-s);line-height:1.15;text-align:center}
.qk .emo{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s)}
.q-express{background:var(--saffron-soft)}.q-sain{background:var(--olive-soft)}.q-budget{background:#EAF2E3}.q-enfants{background:var(--tomato-soft)}
.q-thermomix{background:var(--olive-soft)}.q-airfryer{background:var(--saffron-soft)}.q-weekend{background:var(--tomato-soft)}.q-monde{background:var(--sky-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q-budget{background:var(--olive-soft)}}
:root[data-theme="dark"] .q-budget{background:var(--olive-soft)}
.feat .featb{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:0;padding:0;border:0;border-radius:24px;overflow:hidden;width:100%;text-align:left;background:transparent;align-items:stretch;justify-content:stretch;color:var(--ink)}
.feat .art{display:grid;place-items:center;min-height:180px}
.feat .art .plate{--s:124px}
.feat .ftxt{display:grid;gap:8px;padding:18px;align-content:center}
.feat .fname{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15}
@media (max-width:560px){.feat .featb{grid-template-columns:1fr}.feat .art{min-height:150px}.quick{gap:6px}.qk{font-size:11px;padding:10px 2px}.qk .emo{width:40px;height:40px;font-size:22px}}
.coll{display:grid;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sechead h2{font-size:20px}
.seeall{padding:6px 4px;font-size:13px;color:var(--olive);white-space:nowrap}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(156px,42%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
@media (min-width:700px){.carousel{grid-auto-columns:196px}}
.rc.sm{scroll-snap-align:start}
.rc .appb{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow-s)}
.rc .meta span{white-space:nowrap}
.rc .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.gd{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--display)}
.g-A{background:var(--olive-soft);color:var(--olive)}.g-B{background:var(--saffron-soft);color:#9A6210}.g-C{background:var(--tomato-soft);color:var(--tomato)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-B{color:var(--saffron)}}
:root[data-theme="dark"] .g-B{color:var(--saffron)}
.filt{flex:none;border-radius:99px;box-shadow:var(--shadow-s);border-color:transparent;padding:11px 14px}
.filt.on{background:var(--ink);color:var(--bg)}
.filt b{background:var(--saffron);color:#2A1D05;border-radius:99px;padding:0 7px;font-size:12px}
.back{padding:6px 0;color:var(--olive)}
.collhead{display:flex;gap:14px;align-items:center}
.collhead .ci{font-size:30px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s)}
.facopts{display:flex;flex-wrap:wrap;gap:7px}
.facopts button{border-radius:99px;padding:8px 13px;font-size:13.5px}
.facopts button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.gbadge{position:absolute;left:12px;bottom:12px;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:var(--shadow-s)}
.reperes{display:grid;gap:8px;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow-s)}
.why{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
.why .emo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.why.up .emo{background:var(--olive-soft)}.why.down .emo{background:var(--tomato-soft)}

/* Il manque */
.mq{display:grid;gap:12px;background:linear-gradient(140deg,var(--saffron-soft),var(--surface) 70%)}
.mqh{display:flex;gap:12px;align-items:center}
.mqh>.emo{font-size:28px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s);flex:none}
.mqform{display:flex;gap:8px;align-items:center}
.mqform .search input{box-shadow:none;border:1.5px solid var(--line)}
.mqsug{display:flex;flex-wrap:wrap;gap:6px}
.sg{padding:6px 11px 6px 8px;border-radius:99px;font-size:13px;border-color:transparent;background:var(--surface);box-shadow:var(--shadow-s)}
.sg .emo{font-size:16px}
.mqlist{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.mqi{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:5px 4px 5px 10px;font-size:13.5px;font-weight:800;box-shadow:var(--shadow-s)}
.mqi.done{opacity:.5;text-decoration:line-through}
.mqi button{border:0;background:var(--sunk);width:24px;height:24px;padding:0;border-radius:50%;font-size:11px;color:var(--muted)}
.noted{color:var(--saffron);font-weight:800}
.fab{position:fixed;z-index:9;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:12px 18px 12px 14px;background:var(--saffron);border-color:var(--saffron);color:#2A1D05;font-weight:800;box-shadow:0 8px 22px rgba(227,154,45,.45)}
.fab .emo{font-size:20px}
.pgroup{display:grid;gap:10px}
.pgh{display:flex;align-items:center;gap:8px}
.pgh .emo{font-size:20px}
.pgh b{font-family:var(--display);font-weight:600;font-size:17px}
/* Courses */
.shophead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rayon{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-s);overflow:hidden}
.rayon h3{margin:0;padding:12px 16px 8px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center}
.rayon h3 .emo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);font-size:19px}
.rayon h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.item .ib{width:48px;height:48px;border-radius:50%;padding:0;border:0;background:var(--sunk);font-family:var(--emoji);font-size:26px;position:relative}
.item.done .ib{background:var(--olive-soft);box-shadow:inset 0 0 0 2.5px var(--olive)}
.item.done .ib::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--olive);color:var(--surface);font:800 12px var(--body);display:grid;place-items:center}
.item .n{font-weight:800;min-width:0}
.item .q{font-weight:700;color:var(--muted);font-size:13.5px;margin-left:6px;font-variant-numeric:tabular-nums}
.item .src{display:block;font-size:12px;color:var(--muted);font-weight:600}
.item.done .n{text-decoration:line-through;color:var(--muted)}
.acts2{display:grid;gap:6px;justify-items:end}
.cp{padding:6px 10px;font-size:12.5px;border-radius:99px;background:var(--sunk);border-color:transparent;white-space:nowrap}
.cp.on{background:var(--sky-soft);color:var(--sky)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.ck input{width:22px;height:22px;accent-color:var(--olive);margin:0;padding:0}
.item.done .ck{color:var(--olive)}
.item .px{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ess{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.essi{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-s)}
.essi .emo{font-size:28px}
.essi .nm{font-size:13px;font-weight:800;line-height:1.2;margin-bottom:4px}
.essi.zero{opacity:.55}
.stepper{display:inline-grid;grid-template-columns:32px minmax(36px,auto) 32px;align-items:center;text-align:center;border-radius:99px;background:var(--sunk);overflow:hidden}
.stepper button{border:0;border-radius:0;padding:5px;font-size:17px;background:transparent}
.stepper b{font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px}
.empty{background:var(--surface);border-radius:24px;padding:28px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow-s)}
.empty .emo{font-size:46px;display:block;margin-bottom:8px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:4px}

/* Navigation flottante */
nav.tabs{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--surface);box-shadow:0 10px 30px rgba(20,30,10,.22);border:1px solid var(--line)}
nav.tabs a{display:grid;justify-items:center;gap:0;padding:7px 2px;border-radius:20px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:800;position:relative}
nav.tabs a .ico{font-family:var(--emoji);font-size:23px;line-height:1.15;filter:grayscale(.8);opacity:.7;transition:transform .15s}
nav.tabs a[aria-current="page"]{background:var(--olive);color:var(--surface)}
nav.tabs a[aria-current="page"] .ico{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
nav.tabs .count{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;padding:0 5px;border-radius:99px;background:var(--tomato);color:#fff;font-size:11px;line-height:19px;text-align:center}

/* Feuilles */
dialog{border:0;border-radius:28px 28px 0 0;background:var(--bg);color:var(--ink);padding:0;width:100%;max-width:660px;max-height:92vh;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){dialog{border-radius:28px;margin:auto}}
dialog::backdrop{background:rgba(15,22,10,.5);backdrop-filter:blur(2px)}
.sheet{display:grid;gap:16px;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0}
.hero{position:relative;border-radius:24px;height:170px;display:grid;place-items:center}
.hero .plate{--s:126px}
.hero .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;padding:0;border:0;background:var(--surface);box-shadow:var(--shadow-s);font-size:16px}
.sheet h2.big{font-size:26px}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ing{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:8px 10px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-s)}
.ing .emo{font-size:24px}
.ing small{display:block;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ing.pb{box-shadow:inset 0 0 0 2px var(--sky)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;font-size:15px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--olive);color:var(--surface);display:grid;place-items:center;font:600 15px var(--display)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.tile{display:grid;justify-items:center;align-content:start;gap:7px;padding:12px 4px 10px;border-radius:20px;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow-s);font-size:12.5px;font-weight:800;color:var(--ink);text-align:center;line-height:1.2;position:relative;min-height:98px}
.tile .emo{font-size:32px;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--sunk)}
.tile .plate{--s:52px}
.tile[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--olive);color:var(--surface);font-size:12px;display:grid;place-items:center}
.tile .sub{font-weight:600;color:var(--muted);font-size:11.5px}
.tile.add .emo{background:transparent;border:2px dashed var(--line);font-family:var(--display);font-size:26px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{display:grid;gap:3px;padding:9px 2px;font-size:11.5px;border-radius:16px}
.seg button .emo{font-size:22px}
.seg button[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.iconrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.iconrow button{font-family:var(--emoji);font-size:26px;width:52px;height:52px;padding:0;flex:none;border-radius:50%}
.iconrow button[aria-pressed="true"]{border:2.5px solid var(--olive);background:var(--olive-soft)}
.sel{display:grid;gap:6px}
.selrow{display:grid;grid-template-columns:36px 1fr 72px 32px;gap:6px;align-items:center;background:var(--surface);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow-s)}
.selrow .emo{font-size:24px;text-align:center}
.selrow .nm{font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.selrow .nm small{display:block;font-weight:600;color:var(--muted)}
.selrow input{padding:7px 8px;font-size:15px;border-radius:10px}
.selrow .rmv{padding:4px;border:0;background:none;color:var(--muted);font-size:18px}
.gsearch{position:sticky;top:-18px;background:var(--bg);padding-block:6px;z-index:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.status{font-size:13px;color:var(--saffron);font-weight:700}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media (max-width:520px){
  .days{grid-template-columns:1fr 1fr;gap:10px}
  .day{min-height:138px;padding:12px}
  .rgrid{grid-template-columns:1fr 1fr;gap:10px}
  .rc .art{height:96px}.rc .art .plate{--s:66px}
  .tonight .plate{--s:84px}.tonight h3{font-size:20px}
  .ptiles{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}

// Panier : [{n,q}] (q dans l'unité du catalogue ; null = quantité inconnue)

// ================= Coûts & correspondances =================
function cost(q,u,p){if(q==null||p==null)return 0;if(u==="g")return q/1000*p;if(u==="cl")return q/100*p;return q*p}
const isCat=k=>CATK.has(k);
function inList(name,list){const k=key(name);return list.some(p=>{const pk=key(p);if(!pk)return false;if(k===pk)return true;
  if(k.startsWith(pk+"-")&&!isCat(k))return true;if(pk.startsWith(k+"-")&&!isCat(pk))return true;return false})}
function recipeCost(r){return (r.ingredients||[]).reduce((s,i)=>{const c=catFor(i.n);if(!c||inList(i.n,F().placard))return s;return s+cost(i.q,c.u,c.p)},0)}
const perPers=r=>recipeCost(r)/(r.portions||4);
function panierHits(r){const p=panier().map(x=>x.n);return (r.ingredients||[]).filter(i=>!/oeuf/.test(norm(i.n))&&inList(i.n,p)).map(i=>i.n)}

// ================= Menus équilibrés =================
function genere(onlyKey){
  const s=S(),sl=slots(),pool=all(),saison=saisonNow();
  const plan={...s.plan},used=new Set(),count={vege:0,oeufs:0,poisson:0,volaille:0,viande:0},fec={};
  const keep=x=>onlyKey?x.k!==onlyKey:(s.verrous[x.k]&&plan[x.k]);
  const soup=r=>/soupe|velout|minestrone/i.test(r.nom||"");let soups=0;
  sl.forEach(x=>{const r=keep(x)&&byId(plan[x.k]);if(r&&r.type){used.add(r.id);count[r.type]++;fec[r.fec]=(fec[r.fec]||0)+1;if(soup(r))soups++}});
  let cC=0;sl.forEach(x=>{const r=keep(x)&&byId(plan[x.k]);if(r&&r.type&&grade(r)==="C")cC++});
  const sc=sl.length/7;let prev=null,prevFec=null;
  for(const x of sl){
    if(keep(x)){const r=byId(plan[x.k]);prev=r?.type;prevFec=r?.fec;continue}
    let best=null,bs=-1e9;
    for(const r of pool){
      let v=Math.random()*3;
      if(used.has(r.id))v-=30; if(s.recent.includes(r.id))v-=5; if(isFav(r.id))v+=2.5; v+={A:1.5,B:.5,C:-1}[grade(r)]||0; if(grade(r)==="C"&&cC>=2)v-=4;
      if(r.saison&&r.saison!=="t"&&r.saison!==saison)v-=6;
      v+=panierHits(r).length*(x.i<=3?2.5:1.2);
      if([0,1,4,5,6].includes(x.i)&&x.label==="Soir"&&(r.min||30)>45)v-=5;
      if(x.i===0&&(r.min||30)>35)v-=3;
      const[mn,mx]=CIBLE[r.type]||[0,7],c=count[r.type]||0;
      if(c<mn*sc)v+=4;if(c>=mx*sc)v-=8;if(r.type===prev)v-=3.5;
      if(soup(r)&&soups>=1)v-=7;if(r.fec&&r.fec===prevFec)v-=2.5;if(r.fec&&(fec[r.fec]||0)>=2)v-=3;
      if(v>bs){bs=v;best=r}
    }
    plan[x.k]=best.id;used.add(best.id);if(grade(best)==="C")cC++;count[best.type]++;fec[best.fec]=(fec[best.fec]||0)+1;if(soup(best))soups++;prev=best.type;prevFec=best.fec;
  }
  return plan;
}
function bilan(){const c={vege:0,oeufs:0,poisson:0,volaille:0,viande:0};slots().forEach(x=>{const r=byId(S().plan[x.k]);if(r&&r.type)c[r.type]++});return c}

// ================= Liste de courses =================
function roundQ(q,u){if(u==="g")return Math.ceil(q/50)*50;if(u==="cl")return Math.ceil(q/10)*10;if(u==="kg"||u==="l")return Math.round(q*10)/10;return Math.max(1,Math.ceil(q-0.05))}
function fmtQ(q,u){if(q==null)return"";const big=u==="g"&&q>=1000;const uu=u==="pièce"?"":big?"kg":u;const qq=big?Math.round(q/100)/10:q;const pl=qq>1&&["boîte","botte","paquet","pack","bouteille"].includes(uu)?"s":"";return String(qq).replace(".",",")+(uu?" "+uu+pl:"")}
function liste(){
  const s=S(),f=F(),agg=new Map(),skip=new Set(),use={};
  const add=(n,q,u,src)=>{const c=catFor(n),kk=key(n),cur=agg.get(kk)||{n:c?c.n:n,u:c?c.u:(u||""),q:0,hasQ:false,r:c?c.r:8,src:new Set(),recq:0};
    if(q!=null){cur.q+=q;cur.hasQ=true;if(!["essentiel","ajout","📝 il manque"].includes(src))cur.recq+=q}cur.src.add(src);agg.set(kk,cur)};
  slots().forEach(x=>{const r=byId(s.plan[x.k]);if(!r||!r.ingredients)return;const k=f.personnes/(r.portions||4);
    r.ingredients.forEach(i=>{if(inList(i.n,f.placard)||!catFor(i.n)&&i.q==null){skip.add(i.n);return}add(i.n,i.q!=null?i.q*k:null,i.u,r.nom)})});
  f.essentiels.filter(e=>e.q>0).forEach(e=>add(e.n,e.q,null,"essentiel"));
  (s.extras||[]).forEach(e=>add(e.n,e.q,e.u,"ajout"));
  manque.forEach(m=>add(m.n,m.q,m.u,"📝 il manque"));
  // Déduction du panier bio
  for(const p of panier()){
    const entry=[...agg.entries()].find(([,it])=>!/oeuf/.test(norm(it.n))&&inList(it.n,[p.n]));
    const pk=key(p.n);
    if(!entry){use[pk]={recu:p.q,besoin:0};continue}
    const[kk,it]=entry;use[pk]={recu:p.q,besoin:it.recq||0};
    if(p.q==null||!it.hasQ||catFor(p.n)?.u!==it.u){agg.delete(kk);skip.add(it.n);continue}
    if(it.q<=p.q){agg.delete(kk);skip.add(it.n)}else{it.q-=p.q;it.note=`${fmtQ(p.q,it.u)} déjà dans le panier bio`}
  }
  const eggs=agg.get(key("Œufs"));
  if(eggs&&eggs.hasQ){const need=Math.ceil(eggs.q)-(s.oeufsPanier||0);if(need<=0){agg.delete(key("Œufs"));skip.add("œufs")}else{eggs.q=need;eggs.note=`${s.oeufsPanier} déjà dans le panier bio`}}

const ORIG={fr:["Française","🥖"],ita:["Italienne","🍝"],asie:["Asiatique","🥢"],orient:["Orientale","🫖"],mex:["Mexicaine","🌮"],inde:["Indienne","🍛"],esp:["Espagnole","🥘"],usa:["Américaine","🍔"],monde:["Fusion","🌍"]};
const GRADE={A:["Très équilibré","g-A","🥗"],B:["Équilibré","g-B","🙂"],C:["Plaisir","g-C","🧁"]};
const HERBS=new Set(["ail","echalote","persil","coriandre","basilic","gingembre","citron"].map(key));
const CHEESE={"gruyere-rape":1,"parmesan":1,"comte":1,"feta":1,"ricotta":1,"mozzarella":125,"fromage-de-chevre":150,"reblochon":450};
const SCACHE=new Map();
function sante(r){
  const ck=r.id+"|"+(r.maj||"");if(SCACHE.has(ck))return SCACHE.get(ck);
  const ings=r.ingredients||[],pp=r.portions||4,why=[];let sc=0;
  const veg=ings.filter(i=>{const c=catFor(i.n);return c&&(c.r===0&&!HERBS.has(key(c.n))||/legumes-surgele|petits-pois/.test(key(c.n)))}).length;
  sc+=Math.min(veg,4);
  if(veg>=3)why.push(["🥕",`${veg} légumes différents`,1]);else if(veg<=1)why.push(["🥕","Peu de légumes : ajoutez une salade",-1]);
  if(ings.some(i=>/lentille|pois-chiche|haricots-rouge|haricots-blanc|pois-casse/.test(key(i.n)))){sc+=1.5;why.push(["🫘","Légumineuses : fibres et protéines",1])}
  if(r.type==="poisson"){sc+=2;why.push(["🐟","Poisson : riche en oméga-3",1])}
  else if(r.type==="vege"){sc+=1;why.push(["🌱","Sans viande",1])}
  else if(r.type==="volaille"){sc+=1;why.push(["🍗","Viande blanche, plus maigre",1])}
  else if(r.type==="oeufs"){sc+=.5;why.push(["🥚","Œufs : protéines complètes",1])}
  else if(r.type==="viande"){sc-=1;why.push(["🥩","Viande rouge ou porc : 2 fois par semaine maximum",-1])}
  let fro=0;ings.forEach(i=>{const m=CHEESE[key(i.n)];if(m&&i.q)fro+=i.q*m});fro/=pp;
  if(fro>50){sc-=1.5;why.push(["🧀","Riche en fromage",-1])}else if(fro>25)sc-=.5;
  const creme=ings.filter(i=>key(i.n)==="creme-fraiche").reduce((a,i)=>a+(i.q||0),0)/pp;if(creme>4){sc-=1;why.push(["🍶","Crème : à servir avec des légumes",-1])}
  if(ings.some(i=>/lardon|chorizo|saucisse|merguez/.test(key(i.n)))){sc-=1.5;why.push(["🥓","Charcuterie",-1])}
  if(ings.some(i=>/pate-brisee|pate-feuilletee|pate-a-pizza/.test(key(i.n)))){sc-=1;why.push(["🥧","Pâte à tarte ou à pizza",-1])}
  if(/frites/i.test(r.nom)&&r.app==="airfryer")why.push(["💨","Frites à l'Airfryer : 1 cuillère d'huile seulement",1]);
  const g=sc>=4?"A":sc>=1.5?"B":"C",res={sc,g,why};SCACHE.set(ck,res);return res;
}

// ================= Connexion au serveur (Google Apps Script) =================
// ⚠️ Collez ici l'adresse de votre serveur Apps Script, et le même mot de passe que dans Code.gs
const API_URL = "COLLEZ_ICI_L_ADRESSE_DU_SERVEUR";
const CLE = "CHANGEZ-MOI";

const SYNC = (()=>{
  const LS="menus-du-foyer-etat";
  let etat={semaine:null,foyer:null,recettes:{},manque:{},maj:0},pending=0,queue=Promise.resolve(),lastOk=0,online=true;
  const docL={semaine:[],foyer:[]},colL={recettes:[],manque:[]};
  try{const c=JSON.parse(localStorage.getItem(LS)||"null");if(c)etat=Object.assign(etat,c)}catch(_){}
  const configured=/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
  const save=()=>{try{localStorage.setItem(LS,JSON.stringify(etat))}catch(_){}};
  const docSnap=n=>({exists:etat[n]!=null,data:()=>etat[n]});
  const colSnap=c=>({docs:Object.entries(etat[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  function emit(){Object.keys(docL).forEach(n=>docL[n].forEach(f=>f(docSnap(n))));Object.keys(colL).forEach(c=>colL[c].forEach(f=>f(colSnap(c))));syncBadge()}
  function apply(e){if(e&&typeof e==="object"){etat=Object.assign({semaine:null,foyer:null,recettes:{},manque:{}},e);save()}}
  async function pull(){
    if(!configured||pending)return;
    try{const r=await fetch(API_URL+"?cle="+encodeURIComponent(CLE)+"&t="+Date.now());const j=await r.json();
      if(j.erreur==="cle"){status("Mot de passe refusé par le serveur : vérifiez que CLE est le même dans index.html et dans Code.gs.");return}
      if(j.ok&&!pending&&(j.etat.maj||0)!==(etat.maj||0)){apply(j.etat);emit()}
      online=true;lastOk=Date.now();syncBadge()}
    catch(_){online=false;syncBadge()}
  }
  function send(body){
    pending++;syncBadge();
    queue=queue.then(async()=>{
      for(let essai=0;essai<3;essai++){
        try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({cle:CLE,...body})});
          const j=await r.json();if(j.erreur)throw new Error(j.erreur);
          pending--;if(!pending){apply(j.etat);emit()}online=true;lastOk=Date.now();syncBadge();return}
        catch(err){if(err.message==="cle"){pending--;status("Mot de passe refusé par le serveur.");syncBadge();return}await new Promise(r=>setTimeout(r,1500*(essai+1)))}
      }
      pending--;online=false;syncBadge();status("Pas de connexion : la dernière modification n'a pas pu être enregistrée. Réessayez dans un instant.");
    });
    return queue;
  }
  const local=(fn)=>{fn();save();emit()};
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const db={
    doc(path){const[col,id]=path.split("/");const single=col==="semaine"?"semaine":col==="reglages"?"foyer":null;
      if(single)return{
        onSnapshot(f){docL[single].push(f);setTimeout(()=>f(docSnap(single)),0);return()=>{}},
        set(data){local(()=>etat[single]=data);return configured?send({action:"setDoc",nom:single,data}):Promise.resolve()},
        update(data){local(()=>etat[single]=Object.assign({},etat[single]||{},data));return configured?send({action:"patchDoc",nom:single,data}):Promise.resolve()}};
      return{
        set(data){local(()=>etat[col][id]=data);return configured?send({action:"putItem",col,id,data}):Promise.resolve()},
        update(data){local(()=>etat[col][id]=Object.assign({},etat[col][id]||{},data));return configured?send({action:"patchItem",col,id,data}):Promise.resolve()},
        delete(){local(()=>delete etat[col][id]);return configured?send({action:"delItem",col,id}):Promise.resolve()}};
    },
    collection(col){return{
      onSnapshot(f){colL[col].push(f);setTimeout(()=>f(colSnap(col)),0);return()=>{}},
      async add(data){const id=newId();await db.doc(col+"/"+id).set(data);return{id}}}}
  };
  function syncBadge(){const b=document.getElementById("sync");if(!b)return;
    if(!configured){b.textContent="⚙️ Serveur à relier";b.className="sync warn";return}
    if(pending){b.textContent="⏳ Enregistrement…";b.className="sync";return}
    if(!online){b.textContent="📴 Hors ligne";b.className="sync warn";return}
    b.textContent="✓ Synchronisé";b.className="sync ok"}
  if(configured){setInterval(()=>{if(document.visibilityState==="visible")pull()},8000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});window.addEventListener("focus",pull);pull()}
  return{db,configured,pull,syncBadge};
})();

// ================= Il manque =================
function mqBlock(ctx){const items=manque.slice().sort((a,b)=>(b.ajoute||"").localeCompare(a.ajoute||""));
  return `<div class="mqh"><span class="emo">📝</span><div><h2 style="font-size:19px">Il manque quelque chose ?</h2><p class="hint">Notez-le dès que vous le voyez. Aurélie et vous partagez la même liste.</p></div></div>
  <form class="mqform" data-mqform="${ctx}"><div class="search" style="flex:1"><input id="mq-${ctx}" data-mq="${ctx}" placeholder="ex. café, 2 lait, piles, film alimentaire…" autocomplete="off" enterkeyhint="done"></div><button class="primary" type="submit">Ajouter</button></form>
  <div class="mqsug" id="mqs-${ctx}">${mqSug("")}</div>
  ${items.length?`<div class="mqlist">${items.map(m=>`<span class="mqi ${S().coches[key(m.n)]?"done":""}"><span class="emo">${emojiFor(m.n)}</span>${esc(m.n)}${m.q>1?` ×${String(m.q).replace(".",",")}`:""}<button data-mqrm="${m.id}" aria-label="Retirer ${esc(m.n)}">✕</button></span>`).join("")}</div>`:""}`}
function mqSug(q){const nq=norm(q.replace(/^\d+([.,]\d+)?\s*/,""));const have=new Set(manque.map(m=>key(m.n)));
  let list=nq?CAT.filter(c=>norm(c.n).includes(nq)).slice(0,8):FREQ.map(catFor).filter(Boolean).filter(c=>!have.has(key(c.n))).slice(0,8);
  return `${nq?"":`<span class="lab" style="flex-basis:100%">Souvent oubliés</span>`}${list.map(c=>`<button type="button" class="sg" data-mqadd="${esc(c.n)}"><span class="emo">${c.e}</span>${esc(c.n)}</button>`).join("")}`}
const FREQ=["Café","Papier toilette","Lait","Beurre","Œufs","Pain de mie","Liquide vaisselle","Sacs poubelle","Essuie-tout","Pastilles lave-vaisselle","Éponges","Dentifrice","Confiture","Biscuits","Céréales","Eau gazeuse"];
async function addManque(txt){
  txt=String(txt||"").trim();if(!txt)return;
  const m=txt.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);let q=m?+m[1].replace(",","."):1,n=m?m[2]:txt;
  const c=catFor(n)||CAT.find(x=>norm(x.n).startsWith(norm(n))&&norm(n).length>=3);
  if(c){n=c.n;if(!m)q=c.u==="g"?500:c.u==="cl"?50:1}else n=n.charAt(0).toUpperCase()+n.slice(1);
  const ex=manque.find(x=>key(x.n)===key(n));
  if(!db){toast("Hors connexion : article non enregistré");return}
  try{if(ex){await db.doc("manque/"+ex.id).update({q:(ex.q||1)+(c&&c.u==="g"&&!m?500:q)});toast(`${n} : quantité augmentée`)}
    else{await db.collection("manque").add({n,q,u:c?c.u:"",ajoute:new Date().toISOString()});toast(`${n} ajouté à la liste 📝`)}
    const c2={...S().coches};if(c2[key(n)]){delete c2[key(n)];saveSemaine({coches:c2})}}catch(e){denied(e)}
}
function sheetMq(){openSheet(`<div class="row spread"><span></span><button class="ghost" data-close aria-label="Fermer">✕</button></div>${mqBlock("sheet")}`);setTimeout(()=>$("#mq-sheet")?.focus(),60)}

// ================= Événements =================
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset,s=S();
  if(d.close!=null){closeSheet();return}
  if(d.pan!=null){const k=key(d.pan),p=panier(),ix=p.findIndex(x=>key(x.n)===k);if(ix>=0)p.splice(ix,1);else p.push({n:d.pan,q:panDefault(d.pan)});saveSemaine({panier:p});return}
  if(d.panq){const[n,dl]=d.panq.split(":");const p=panier(),it=p.find(x=>key(x.n)===key(n));if(!it)return;
    it.q=Math.round(((it.q||0)+(+dl)*panStep(n))*10)/10;if(it.q<=0)p.splice(p.indexOf(it),1);saveSemaine({panier:p});return}
  if(t.id==="vegAll"){showAllVeg=true;render();return}
  if(t.id==="panOther"){openSheet(`<div class="row spread"><h2>Autre produit du panier</h2><button class="ghost" data-close aria-label="Fermer">✕</button></div><div class="row" style="flex-wrap:nowrap"><input id="panIn" placeholder="ex. topinambours"><button class="primary" id="panAdd">Ajouter</button></div>`);setTimeout(()=>$("#panIn")?.focus(),50);return}
  if(t.id==="panAdd"){const v=$("#panIn").value.trim();if(v){const p=panier();p.push({n:v,q:panDefault(v)});saveSemaine({panier:p})}closeSheet();return}
  if(t.id==="gen"){await saveSemaine({plan:genere()});toast("Semaine proposée ✨");return}
  if(d.day){sheetDay(d.day);return}
  if(d.open){sheetRecipe(byId(d.open),d.forday||null);return}
  if(d.setday||d.pickday){const k=d.setday||d.pickday;saveSemaine({plan:{...s.plan,[k]:d.rid}});closeSheet();if(d.pickday)toast("Ajouté au menu 📅");return}
  if(d.plan){sheetPlan(d.plan);return}
  if(d.dayrand){const p=genere(d.dayrand);saveSemaine({plan:{...s.plan,[d.dayrand]:p[d.dayrand]}});sheetDay(d.dayrand);return}
  if(d.daylock){saveSemaine({verrous:{...s.verrous,[d.daylock]:!s.verrous[d.daylock]}});closeSheet();return}
  if(d.dayclear){const p={...s.plan};delete p[d.dayclear];saveSemaine({plan:p});closeSheet();return}
  if(t.id==="newWeek"){if(d.confirm!=="1"){d.confirm="1";t.textContent="Confirmer : repartir à zéro";setTimeout(()=>{if(t.isConnected){d.confirm="";t.textContent="Passer à la semaine suivante"}},4000);return}
    const nd=parseISO(s.debut);nd.setDate(nd.getDate()+7);const recent=[...Object.values(s.plan),...s.recent].filter(x=>x&&x!=="restes").slice(0,14);
    manque.filter(m=>s.coches[key(m.n)]).forEach(m=>db&&db.doc("manque/"+m.id).delete().catch(()=>{}));
    saveSemaine({debut:iso(nd),panier:[],plan:{},verrous:{},coches:{},extras:(s.extras||[]).filter(e=>!s.coches[key(e.n)]),recent});toast("Nouvelle semaine prête");return}
  if(d.fav){const fv=F().favoris.slice(),ix=fv.indexOf(d.fav);if(ix>=0)fv.splice(ix,1);else fv.push(d.fav);await saveFoyer({favoris:fv});t.textContent=ix>=0?"🤍 Favori":"❤️ Favori";return}
  if(d.coll){coll=d.coll;tri="reco";render();window.scrollTo(0,0);return}
  if(t.id==="collBack"){coll=null;fac={};recherche="";render();window.scrollTo(0,0);return}
  if(d.tri){tri=d.tri;render();return}
  if(t.id==="openFac"){sheetFac();return}
  if(d.fac){const[k,v]=d.fac.split(":");fac[k]=fac[k]===v?null:v;render();sheetFac();return}
  if(t.id==="facReset"){fac={};render();sheetFac();return}
  if(d.copy){lastCopied=d.copy;try{await navigator.clipboard.writeText(d.term);toast(`« ${d.term} » copié`)}catch(_){toast("Copie refusée par le navigateur")}render();return}
  if(d.chk){const c={...s.coches};if(c[d.chk])delete c[d.chk];else c[d.chk]=true;saveSemaine({coches:c});return}
  if(d.ess){const[ix,dl]=d.ess.split(":").map(Number);const es=F().essentiels.map(x=>({...x}));es[ix].q=Math.max(0,es[ix].q+dl);saveFoyer({essentiels:es});return}
  if(t.id==="essAdd"){sheetPick("ess");return}
  if(d.mqadd){await addManque(d.mqadd);if($("#sheet").open&&$("#mq-sheet"))sheetMq();return}
  if(d.mqrm){if(db)try{await db.doc("manque/"+d.mqrm).delete()}catch(err){denied(err)}if($("#sheet").open&&$("#mq-sheet"))sheetMq();return}
  if(t.id==="fabMq"){sheetMq();return}
  if(d.pick){togglePick(d.pick,d.mode);return}
  if(t.id==="copy"){const L=liste();const txt=RAYONS.map(([n],r)=>{const it=L.items.filter(i=>i.r===r&&!s.coches[i.id]);return it.length?n.toUpperCase()+"\n"+it.map(i=>"- "+i.n+(fmtQ(i.q,i.u)?" ("+fmtQ(i.q,i.u)+")":"")).join("\n"):""}).filter(Boolean).join("\n\n");
    try{await navigator.clipboard.writeText(txt);toast("Liste copiée 📋")}catch(_){toast("Copie refusée par le navigateur")}return}
  if(t.id==="uncheck"){saveSemaine({coches:{}});return}
  if(t.id==="newR"||t.id==="newR2"){sheetEdit(null);return}
  if(d.newfor){sheetEdit(null);draft.forDay=d.newfor;return}
  if(d.editr){sheetEdit(byId(d.editr));return}
  if(d.ricon){draft.icone=d.ricon;drawIcons();return}
  if(d.rtype){draft.type=d.rtype;drawSeg();return}
  if(d.rapp){draft.app=d.rapp;drawSeg();return}
  if(d.rmin){draft.min=Math.min(240,Math.max(5,draft.min+(+d.rmin)));$("#rMin").textContent=draft.min+" min";return}
  if(d.rp){draft.portions=Math.min(12,Math.max(1,draft.portions+(+d.rp)));$("#rPort").textContent=draft.portions;return}
  if(d.iadd){toggleIng(d.iadd);return}
  if(d.icustom){toggleIng(d.icustom);$("#rSearch").value="";drawCat("");return}
  if(d.irm!=null){draft.ingredients.splice(+d.irm,1);drawSel();drawCat($("#rSearch").value);return}
  if(t.id==="rSave"){saveRecipe();return}
  if(t.id==="rDel"){if(d.confirm!=="1"){d.confirm="1";t.textContent="Confirmer la suppression";return}closeSheet();if(db&&draft.id)try{await db.doc("recettes/"+draft.id).delete();toast("Recette supprimée")}catch(err){denied(err)}return}
  if(d.step){const[w,dl]=d.step.split(":");const f=F();
    if(w==="pers")saveFoyer({personnes:Math.min(12,Math.max(1,f.personnes+(+dl)))});else if(w==="budget")saveFoyer({budget:Math.max(20,f.budget+(+dl))});else saveSemaine({oeufsPanier:Math.max(0,s.oeufsPanier+(+dl))});return}
  if(d.repas){saveFoyer({repas:d.repas});return}
  if(t.id==="savePlac"){saveFoyer({placard:$("#sPlac").value.split(",").map(x=>x.trim()).filter(Boolean)},"Placard enregistré");return}
});
document.addEventListener("change",e=>{const id=e.target.dataset?.chk2;if(id==null)return;const c={...S().coches};if(e.target.checked)c[id]=true;else delete c[id];saveSemaine({coches:c})});
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-mqform]");if(!f)return;e.preventDefault();const ctx=f.dataset.mqform,inp=$("#mq-"+ctx),v=inp.value;inp.value="";await addManque(v);if(ctx==="sheet")sheetMq();else setTimeout(()=>$("#mq-tab")?.focus(),30)});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.mq){const box=$("#mqs-"+d.mq);if(box)box.innerHTML=mqSug(t.value)}
  if(t.id==="libSearch"){recherche=t.value;render()}
  if(t.id==="rSearch")drawCat(t.value);
  if(t.id==="pSearch")drawPick(d.mode,t.value);
  if(d.iq!=null)draft.ingredients[+d.iq].q=t.value===""?null:+t.value});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target,v=t.value?.trim();
  if(t.id==="panIn"){e.preventDefault();$("#panAdd").click()}
  if(t.id==="rSearch"&&v){e.preventDefault();const c=CAT.find(c=>norm(c.n).includes(norm(v)));toggleIng(c?c.n:v);t.value="";drawCat("")}
  if(t.id==="pSearch"&&v){e.preventDefault();const c=CAT.find(c=>norm(c.n).includes(norm(v)));togglePick(c?c.n:v,t.dataset.mode);t.value="";drawPick(t.dataset.mode,"")}});

function route(){const h=location.hash.slice(1);tab=["semaine","courses","recettes","foyer"].includes(h)?h:"semaine";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
(async()=>{
  db=SYNC.db;
  if(!SYNC.configured)status("Le serveur n'est pas encore relié : l'appli fonctionne, mais seulement sur ce téléphone. Suivez le guide pour coller l'adresse du serveur dans index.html.");
  const err=e=>status(e.code==="revoked"?"L'accès à ces données a changé.":"Synchronisation interrompue, rechargez la page.");
  const got={r:0,s:0,f:0},ready=()=>{if(got.r&&got.s&&got.f)loaded=true;render()};
  db.collection("recettes").onSnapshot(q=>{perso=q.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!r.exemple&&r.nom).map(r=>({app:"poele",min:30,saison:"t",fec:"",steps:[],origine:"fr",kids:false,reheat:false,...r,builtin:false}));got.r=1;ready()},err);
  db.doc("semaine/courante").onSnapshot(d=>{semaine=d.exists?d.data():null;got.s=1;ready()},err);
  db.doc("reglages/foyer").onSnapshot(d=>{foyer=d.exists?d.data():null;got.f=1;ready()},err);
  db.collection("manque").onSnapshot(q=>{manque=q.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.n);render();if($("#sheet").open&&$("#mq-sheet")&&document.activeElement?.id!=="mq-sheet"){const v=$("#mq-sheet").value;sheetMq();$("#mq-sheet").value=v}},err);
})();
