<style>
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
.sync{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--on-band)}
.sync.warn{background:var(--saffron);color:#2A1D05}
/* Layout: appli de cuisine provençale — bandeau olive avec la carte « Ce soir » qui le chevauche, assiettes illustrées, cartes colorées par protéine, navigation flottante en bas */
:root{
  --bg:#F2F4EA; --surface:#FFFFFF; --sunk:#EAEEDF; --line:#DDE3CF;
  --ink:#1E2619; --muted:#667058;
  --olive:#44612A; --olive-deep:#2E4720; --olive-soft:#E1EAD0; --on-band:#F4F7EC;
  --saffron:#E39A2D; --saffron-soft:#FCEFD6; --tomato:#D4472E; --tomato-soft:#FBE1DA; --sky:#2F78A2; --sky-soft:#DCEBF3;
  --plate:#FFFFFF; --plate-rim:#EEEFE8; --shadow:0 8px 24px rgba(40,55,25,.10); --shadow-s:0 2px 8px rgba(40,55,25,.08);
  --g-vege:linear-gradient(140deg,#E6F1D6,#CFE4B5); --g-poisson:linear-gradient(140deg,#E0EFF7,#C2DEEE);
  --g-volaille:linear-gradient(140deg,#FDF1D6,#F7D99F); --g-viande:linear-gradient(140deg,#FCE6DF,#F4C3B4);
  --g-oeufs:linear-gradient(140deg,#FBF6D6,#F1E59C); --g-none:linear-gradient(140deg,#F1F3EA,#E6EADB);
  --display:"Fredoka", "Nunito", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12160F; --surface:#1B2117; --sunk:#242C1F; --line:#333D2C; --ink:#ECF0E4; --muted:#A3AD95;
  --olive:#A3CB74; --olive-deep:#1C2B12; --olive-soft:#263420; --on-band:#EEF3E4;
  --saffron:#F2B653; --saffron-soft:#3A2E17; --tomato:#F07D66; --tomato-soft:#3C221C; --sky:#83BEDF; --sky-soft:#1C2E38;
  --plate:#EDEFE6; --plate-rim:#D6DACB; --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3);
  --g-vege:linear-gradient(140deg,#24331B,#2E4222); --g-poisson:linear-gradient(140deg,#1B2D37,#213A47);
  --g-volaille:linear-gradient(140deg,#382B15,#47361A); --g-viande:linear-gradient(140deg,#3A211B,#4A2A22);
  --g-oeufs:linear-gradient(140deg,#333015,#423D1A); --g-none:linear-gradient(140deg,#20271B,#262E20); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1B2117; --sunk:#242C1F; --line:#333D2C; --ink:#ECF0E4; --muted:#A3AD95;
  --olive:#A3CB74; --olive-deep:#1C2B12; --olive-soft:#263420; --on-band:#EEF3E4;
  --saffron:#F2B653; --saffron-soft:#3A2E17; --tomato:#F07D66; --tomato-soft:#3C221C; --sky:#83BEDF; --sky-soft:#1C2E38;
  --plate:#EDEFE6; --plate-rim:#D6DACB; --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-s:0 2px 8px rgba(0,0,0,.3);
  --g-vege:linear-gradient(140deg,#24331B,#2E4222); --g-poisson:linear-gradient(140deg,#1B2D37,#213A47);
  --g-volaille:linear-gradient(140deg,#382B15,#47361A); --g-viande:linear-gradient(140deg,#3A211B,#4A2A22);

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-block:0 170px;padding-left:0;padding-right:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--olive-deep)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
.emo{font-family:var(--emoji);line-height:1}

/* Bandeau */
.band{background:var(--olive-deep);color:var(--on-band);position:relative;overflow:hidden;padding-block:22px 64px}
.band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);background-size:18px 18px}
.band::after{content:"🫒";font-family:var(--emoji);position:absolute;right:-18px;top:-10px;font-size:150px;opacity:.13;transform:rotate(-18deg)}
.band .wrap{position:relative;z-index:1}
.band .kicker{font-size:13px;font-weight:700;opacity:.8;letter-spacing:.02em}
.band h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,7vw,38px);margin:2px 0 0;letter-spacing:-.01em;line-height:1.05}
.band h1 span{color:var(--saffron)}
.band.small{padding-block:22px 26px}
main{display:grid;gap:28px;margin-top:-46px;position:relative;z-index:2}
main.flat{margin-top:18px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.lab{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}
button,.btn{font:700 14.5px var(--body);border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;-webkit-tap-highlight-color:transparent;transition:transform .12s,box-shadow .12s,background .15s}
button:active{transform:scale(.96)}
.primary{background:var(--olive)!important;border-color:var(--olive)!important;color:var(--surface)!important;box-shadow:0 4px 12px rgba(68,97,42,.28)}
.sun{background:var(--saffron)!important;border-color:var(--saffron)!important;color:#2A1D05!important;box-shadow:0 4px 12px rgba(227,154,45,.32)}
.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.soft{background:var(--sunk);border-color:transparent}
button:disabled{opacity:.45;transform:none}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
input,textarea{font:16px var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:110px;line-height:1.5}
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}

/* Assiette */
.plate{--s:56px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--s)*.52);line-height:1;
  background:radial-gradient(circle at 50% 50%,var(--plate) 0 58%,var(--plate-rim) 59% 66%,var(--plate) 67% 100%);box-shadow:0 6px 14px rgba(30,40,20,.18),inset 0 -2px 3px rgba(0,0,0,.05)}
.plate.empty{background:transparent;box-shadow:none;border:2px dashed var(--line);font-family:var(--display);color:var(--muted);font-size:calc(var(--s)*.4)}
.t-vege{background:var(--g-vege)}.t-poisson{background:var(--g-poisson)}.t-volaille{background:var(--g-volaille)}.t-viande{background:var(--g-viande)}.t-oeufs{background:var(--g-oeufs)}.t-none{background:var(--g-none)}

/* Ce soir */
.tonight{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
.tonight .plate{--s:104px}
.tonight .when{color:var(--saffron);font-weight:800;font-size:13px;letter-spacing:.02em}
.tonight h3{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15;margin:2px 0 8px}
.tonight .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.tonight .acts button{flex:1 1 140px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.tm{background:var(--olive-soft);color:var(--olive)}.chip.af{background:var(--saffron-soft);color:#9A6210}.chip.pb{background:var(--sky-soft);color:var(--sky)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.af{color:var(--saffron)}}
:root[data-theme="dark"] .chip.af{color:var(--saffron)}
.chips{display:flex;gap:5px;flex-wrap:wrap}

/* Jours */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.day{position:relative;display:grid;gap:10px;align-content:start;text-align:left;border:0;border-radius:22px;padding:14px;min-height:150px;box-shadow:var(--shadow-s);font-weight:600;justify-content:stretch;color:var(--ink)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);font-weight:700}
.day .dh b{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
.day .dn{font-weight:800;font-size:14.5px;line-height:1.25}
.day.today{outline:3px solid var(--saffron);outline-offset:-3px}
.day .flag{position:absolute;top:-8px;left:14px;background:var(--saffron);color:#2A1D05;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}
.day .lock{position:absolute;top:12px;right:12px;font-size:13px}
.day.isEmpty .dn{color:var(--muted);font-weight:700}

/* Bilan */
.bilan{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{--p:0;--c:var(--olive);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
.ring small{font-size:10.5px;color:var(--muted);font-weight:700}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.dot{border-radius:14px;padding:8px 2px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.dot .emo{font-size:20px;display:block;margin-bottom:2px}
.dot b{font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600;display:block}
.dot.off{box-shadow:inset 0 0 0 2px var(--saffron)}

/* Panier */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pt{position:relative;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-s);display:grid;overflow:hidden;border:2px solid transparent;transition:border-color .15s}
.pt.on{border-color:var(--olive);background:var(--olive-soft)}
.pt .main{border:0;background:transparent;display:grid;justify-items:center;gap:6px;padding:12px 4px 8px;font-size:12.5px;font-weight:800;border-radius:0;line-height:1.15}
.pt .main .emo{font-size:34px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);transition:transform .15s}
.pt.on .main .emo{background:var(--surface);transform:scale(1.06)}
.pt .qty{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;padding:0 6px 8px}
.pt .qty button{padding:0;width:30px;height:30px;border-radius:50%;font-size:17px;border:0;background:var(--surface);box-shadow:var(--shadow-s)}
.pt .qty b{text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.pt .use{height:5px;background:var(--surface)}
.pt .use i{display:block;height:100%;background:var(--saffron)}
.pt .use i.full{background:var(--tomato)}
.pt.add .main .emo{background:transparent;border:2px dashed var(--line);font-family:var(--display);color:var(--muted);font-size:26px}

/* Recettes */
.search{position:relative}
.search input{padding-left:44px;border-radius:99px;box-shadow:var(--shadow-s);border-color:transparent}
.search::before{content:"🔎";font-family:var(--emoji);position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pills button{flex:none;border-radius:99px;padding:8px 14px;font-size:13.5px;box-shadow:var(--shadow-s);border-color:transparent}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.rc{display:grid;grid-template-rows:auto 1fr;padding:0;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-s);overflow:hidden;text-align:left;font-weight:600;justify-content:stretch;align-items:stretch;color:var(--ink)}
.rc:hover{box-shadow:var(--shadow)}
.rc .art{height:112px;display:grid;place-items:center;position:relative}
.rc .art .plate{--s:78px}
.rc .heart{position:absolute;top:10px;right:12px;font-size:18px}
.rc .info{padding:10px 12px 12px;display:grid;gap:7px;align-content:space-between}
.rc .rn{font-weight:800;font-size:14.5px;line-height:1.25}


/* Recettes : collections */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qk{display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:20px;border:0;font-size:12px;font-weight:800;box-shadow:var(--shadow-s);line-height:1.15;text-align:center}
.qk .emo{font-size:26px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s)}
.q-express{background:var(--saffron-soft)}.q-sain{background:var(--olive-soft)}.q-budget{background:#EAF2E3}.q-enfants{background:var(--tomato-soft)}
.q-thermomix{background:var(--olive-soft)}.q-airfryer{background:var(--saffron-soft)}.q-weekend{background:var(--tomato-soft)}.q-monde{background:var(--sky-soft)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q-budget{background:var(--olive-soft)}}
:root[data-theme="dark"] .q-budget{background:var(--olive-soft)}
.feat .featb{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:0;padding:0;border:0;border-radius:24px;overflow:hidden;width:100%;text-align:left;background:transparent;align-items:stretch;justify-content:stretch;color:var(--ink)}
.feat .art{display:grid;place-items:center;min-height:180px}
.feat .art .plate{--s:124px}
.feat .ftxt{display:grid;gap:8px;padding:18px;align-content:center}
.feat .fname{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15}
@media (max-width:560px){.feat .featb{grid-template-columns:1fr}.feat .art{min-height:150px}.quick{gap:6px}.qk{font-size:11px;padding:10px 2px}.qk .emo{width:40px;height:40px;font-size:22px}}
.coll{display:grid;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sechead h2{font-size:20px}
.seeall{padding:6px 4px;font-size:13px;color:var(--olive);white-space:nowrap}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(156px,42%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
@media (min-width:700px){.carousel{grid-auto-columns:196px}}
.rc.sm{scroll-snap-align:start}
.rc .appb{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow-s)}
.rc .meta span{white-space:nowrap}
.rc .meta{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.gd{margin-left:auto;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--display)}
.g-A{background:var(--olive-soft);color:var(--olive)}.g-B{background:var(--saffron-soft);color:#9A6210}.g-C{background:var(--tomato-soft);color:var(--tomato)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g-B{color:var(--saffron)}}
:root[data-theme="dark"] .g-B{color:var(--saffron)}
.filt{flex:none;border-radius:99px;box-shadow:var(--shadow-s);border-color:transparent;padding:11px 14px}
.filt.on{background:var(--ink);color:var(--bg)}
.filt b{background:var(--saffron);color:#2A1D05;border-radius:99px;padding:0 7px;font-size:12px}
.back{padding:6px 0;color:var(--olive)}
.collhead{display:flex;gap:14px;align-items:center}
.collhead .ci{font-size:30px;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s)}
.facopts{display:flex;flex-wrap:wrap;gap:7px}
.facopts button{border-radius:99px;padding:8px 13px;font-size:13.5px}
.facopts button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.gbadge{position:absolute;left:12px;bottom:12px;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:var(--shadow-s)}
.reperes{display:grid;gap:8px;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow-s)}
.why{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
.why .emo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.why.up .emo{background:var(--olive-soft)}.why.down .emo{background:var(--tomato-soft)}

/* Il manque */
.mq{display:grid;gap:12px;background:linear-gradient(140deg,var(--saffron-soft),var(--surface) 70%)}
.mqh{display:flex;gap:12px;align-items:center}
.mqh>.emo{font-size:28px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s);flex:none}
.mqform{display:flex;gap:8px;align-items:center}
.mqform .search input{box-shadow:none;border:1.5px solid var(--line)}
.mqsug{display:flex;flex-wrap:wrap;gap:6px}
.sg{padding:6px 11px 6px 8px;border-radius:99px;font-size:13px;border-color:transparent;background:var(--surface);box-shadow:var(--shadow-s)}
.sg .emo{font-size:16px}
.mqlist{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.mqi{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:5px 4px 5px 10px;font-size:13.5px;font-weight:800;box-shadow:var(--shadow-s)}
.mqi.done{opacity:.5;text-decoration:line-through}
.mqi button{border:0;background:var(--sunk);width:24px;height:24px;padding:0;border-radius:50%;font-size:11px;color:var(--muted)}
.noted{color:var(--saffron);font-weight:800}
.fab{position:fixed;z-index:9;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(92px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:12px 18px 12px 14px;background:var(--saffron);border-color:var(--saffron);color:#2A1D05;font-weight:800;box-shadow:0 8px 22px rgba(227,154,45,.45)}
.fab .emo{font-size:20px}
.pgroup{display:grid;gap:10px}
.pgh{display:flex;align-items:center;gap:8px}
.pgh .emo{font-size:20px}
.pgh b{font-family:var(--display);font-weight:600;font-size:17px}
/* Courses */
.shophead{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rayon{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-s);overflow:hidden}
.rayon h3{margin:0;padding:12px 16px 8px;font-family:var(--display);font-weight:600;font-size:16px;display:flex;gap:10px;align-items:center}
.rayon h3 .emo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);font-size:19px}
.rayon h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.item .ib{width:48px;height:48px;border-radius:50%;padding:0;border:0;background:var(--sunk);font-family:var(--emoji);font-size:26px;position:relative}
.item.done .ib{background:var(--olive-soft);box-shadow:inset 0 0 0 2.5px var(--olive)}
.item.done .ib::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--olive);color:var(--surface);font:800 12px var(--body);display:grid;place-items:center}
.item .n{font-weight:800;min-width:0}
.item .q{font-weight:700;color:var(--muted);font-size:13.5px;margin-left:6px;font-variant-numeric:tabular-nums}
.item .src{display:block;font-size:12px;color:var(--muted);font-weight:600}
.item.done .n{text-decoration:line-through;color:var(--muted)}
.acts2{display:grid;gap:6px;justify-items:end}
.cp{padding:6px 10px;font-size:12.5px;border-radius:99px;background:var(--sunk);border-color:transparent;white-space:nowrap}
.cp.on{background:var(--sky-soft);color:var(--sky)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap}
.ck input{width:22px;height:22px;accent-color:var(--olive);margin:0;padding:0}
.item.done .ck{color:var(--olive)}
.item .px{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ess{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.essi{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow-s)}
.essi .emo{font-size:28px}
.essi .nm{font-size:13px;font-weight:800;line-height:1.2;margin-bottom:4px}
.essi.zero{opacity:.55}
.stepper{display:inline-grid;grid-template-columns:32px minmax(36px,auto) 32px;align-items:center;text-align:center;border-radius:99px;background:var(--sunk);overflow:hidden}
.stepper button{border:0;border-radius:0;padding:5px;font-size:17px;background:transparent}
.stepper b{font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px}
.empty{background:var(--surface);border-radius:24px;padding:28px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow-s)}
.empty .emo{font-size:46px;display:block;margin-bottom:8px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:4px}

/* Navigation flottante */
nav.tabs{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--surface);box-shadow:0 10px 30px rgba(20,30,10,.22);border:1px solid var(--line)}
nav.tabs a{display:grid;justify-items:center;gap:0;padding:7px 2px;border-radius:20px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:800;position:relative}
nav.tabs a .ico{font-family:var(--emoji);font-size:23px;line-height:1.15;filter:grayscale(.8);opacity:.7;transition:transform .15s}
nav.tabs a[aria-current="page"]{background:var(--olive);color:var(--surface)}
nav.tabs a[aria-current="page"] .ico{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
nav.tabs .count{position:absolute;top:2px;right:calc(50% - 26px);min-width:19px;padding:0 5px;border-radius:99px;background:var(--tomato);color:#fff;font-size:11px;line-height:19px;text-align:center}

/* Feuilles */
dialog{border:0;border-radius:28px 28px 0 0;background:var(--bg);color:var(--ink);padding:0;width:100%;max-width:660px;max-height:92vh;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){dialog{border-radius:28px;margin:auto}}
dialog::backdrop{background:rgba(15,22,10,.5);backdrop-filter:blur(2px)}
.sheet{display:grid;gap:16px;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0}
.hero{position:relative;border-radius:24px;height:170px;display:grid;place-items:center}
.hero .plate{--s:126px}
.hero .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;padding:0;border:0;background:var(--surface);box-shadow:var(--shadow-s);font-size:16px}
.sheet h2.big{font-size:26px}
.ings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ing{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:16px;padding:8px 10px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-s)}
.ing .emo{font-size:24px}
.ing small{display:block;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ing.pb{box-shadow:inset 0 0 0 2px var(--sky)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;font-size:15px;align-items:start}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--olive);color:var(--surface);display:grid;place-items:center;font:600 15px var(--display)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.tile{display:grid;justify-items:center;align-content:start;gap:7px;padding:12px 4px 10px;border-radius:20px;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow-s);font-size:12.5px;font-weight:800;color:var(--ink);text-align:center;line-height:1.2;position:relative;min-height:98px}
.tile .emo{font-size:32px;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:var(--sunk)}
.tile .plate{--s:52px}
.tile[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--olive);color:var(--surface);font-size:12px;display:grid;place-items:center}
.tile .sub{font-weight:600;color:var(--muted);font-size:11.5px}
.tile.add .emo{background:transparent;border:2px dashed var(--line);font-family:var(--display);font-size:26px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{display:grid;gap:3px;padding:9px 2px;font-size:11.5px;border-radius:16px}
.seg button .emo{font-size:22px}
.seg button[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.iconrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.iconrow button{font-family:var(--emoji);font-size:26px;width:52px;height:52px;padding:0;flex:none;border-radius:50%}
.iconrow button[aria-pressed="true"]{border:2.5px solid var(--olive);background:var(--olive-soft)}
.sel{display:grid;gap:6px}
.selrow{display:grid;grid-template-columns:36px 1fr 72px 32px;gap:6px;align-items:center;background:var(--surface);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow-s)}
.selrow .emo{font-size:24px;text-align:center}
.selrow .nm{font-weight:800;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.selrow .nm small{display:block;font-weight:600;color:var(--muted)}
.selrow input{padding:7px 8px;font-size:15px;border-radius:10px}
.selrow .rmv{padding:4px;border:0;background:none;color:var(--muted);font-size:18px}
.gsearch{position:sticky;top:-18px;background:var(--bg);padding-block:6px;z-index:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:50;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.status{font-size:13px;color:var(--saffron);font-weight:700}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@media (max-width:520px){
  .days{grid-template-columns:1fr 1fr;gap:10px}
  .day{min-height:138px;padding:12px}
  .rgrid{grid-template-columns:1fr 1fr;gap:10px}
  .rc .art{height:96px}.rc .art .plate{--s:66px}
  .tonight .plate{--s:84px}.tonight h3{font-size:20px}
  .ptiles{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}

/* ===== Rituel du jeudi ===== */
.gear{font-family:var(--emoji);font-size:20px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);text-decoration:none;flex:none}
.back{padding:4px 0;color:var(--olive);justify-self:start}
.big{width:100%;padding:16px;font-size:16px;border-radius:18px}
.big2{padding:14px 10px;font-size:15px;border-radius:16px}
.ritual{display:grid;gap:12px}
.steps2{list-style:none;margin:0;padding:0;display:grid;gap:6px;position:relative}
.steps2 li{position:relative}
.steps2 li:not(:last-child)::after{content:"";position:absolute;left:31px;top:52px;bottom:-10px;width:2px;background:var(--line)}
.steps2 li.done:not(:last-child)::after{background:var(--olive)}
.stp{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:8px;border:0;background:transparent;border-radius:16px;font-weight:600;justify-content:stretch;color:var(--ink)}
.stp:hover{background:var(--sunk)}
.si{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--sunk);position:relative;z-index:1;margin-left:2px}
.done .si{background:var(--olive);color:var(--surface);font-family:var(--display);font-weight:600}
.cur .stp{background:var(--saffron-soft)}
.cur .si{background:var(--saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.st b{display:block;font-size:15.5px;font-weight:800}
.st small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.3}
.done .st b{color:var(--muted)}
.sa{font-size:13px;font-weight:800;color:var(--olive);white-space:nowrap}
.cur .sa{color:#9A6210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cur .sa{color:var(--saffron)}}
:root[data-theme="dark"] .cur .sa{color:var(--saffron)}
.okline{margin:0;text-align:center;font-weight:800;color:var(--olive)}
.newweek{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:linear-gradient(140deg,var(--olive-soft),var(--surface) 70%)}
.newweek>.emo{font-size:34px}
.newweek button{grid-column:1/-1}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:112px;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini-day{display:grid;justify-items:center;gap:6px;padding:10px 6px;border:0;border-radius:18px;box-shadow:var(--shadow-s);text-align:center;color:var(--ink);align-content:start}
.mini-day small{font-weight:800;color:var(--muted);font-size:12px}
.mini-day .plate{--s:50px}
.mini-day .mn{font-size:12px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Panier */
.recu{display:flex;flex-wrap:wrap;gap:6px}
.chip.warn{background:var(--saffron-soft);color:#9A6210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.warn{color:var(--saffron)}}
:root[data-theme="dark"] .chip.warn{color:var(--saffron)}
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border-radius:99px;padding:9px 14px;box-shadow:var(--shadow-s);border-color:transparent;font-size:14px}
.subtabs button .emo{font-size:18px}
.subtabs button b{background:var(--olive);color:var(--surface);border-radius:99px;padding:0 7px;font-size:12px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ctabar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ctabar .big{width:auto;flex:1 1 220px}

/* Menus */
.mlist{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:44px auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:0;border-radius:20px;box-shadow:var(--shadow-s);color:var(--ink);justify-content:stretch;font-weight:600}
.mrow .md{display:grid;line-height:1.1}
.mrow .md b{font-family:var(--display);font-weight:600;font-size:16px}
.mrow .md small{font-size:11.5px;color:var(--muted);font-weight:700}
.mrow .plate{--s:52px}
.mrow .mt b{display:block;font-size:14.5px;font-weight:800;line-height:1.25}
.mrow .mt small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.mrow .mx{color:var(--muted);font-size:18px}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ideas .rc .art{height:96px}.ideas .rc .art .plate{--s:64px}
@media (max-width:520px){.ideas{grid-template-columns:1fr}.ideas .rc{grid-template-columns:100px 1fr;grid-template-rows:auto}.ideas .rc .art{height:auto;min-height:88px}}

/* Liste */
.listhead{display:grid;gap:14px}
.item .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--emoji);font-size:24px}
.item .stepper{grid-template-columns:30px minmax(44px,auto) 30px}
.item .stepper b{font-size:13px}
.link{padding:0;color:var(--olive);font-size:13.5px;text-decoration:underline}

/* Ajouter un produit */
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.crumbs button{padding:4px 6px;font-size:13.5px;color:var(--olive)}
.crumbs b{font-weight:800;color:var(--ink);padding:4px 6px}
.bigcats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:20px;border:0;box-shadow:var(--shadow-s);font-size:15px;font-weight:800;justify-content:stretch;background:var(--surface)}
.bc .emo{font-size:30px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.bc small{grid-column:2;font-size:12px;color:var(--muted);font-weight:700;margin-top:-10px}
.subs .bc{grid-template-rows:auto auto}
.subs .bc .emo{grid-row:span 2}
.tile.has{border-color:var(--olive);background:var(--olive-soft)}
.badge{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--olive);color:var(--surface);font-size:12px;font-weight:800;display:grid;place-items:center}

/* Commande */
.cmd{display:grid;gap:12px}
.cmdcard{display:grid;justify-items:center;gap:4px;padding:10px 0;text-align:center}
.bigemo{font-size:70px;width:124px;height:124px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.cmdcard h2{font-size:26px;margin-top:8px}
.qbig{margin:0;font-family:var(--display);font-size:20px;color:var(--muted)}
.copied{background:var(--sky-soft)!important;color:var(--sky)!important}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--olive);border-radius:4px;transition:width .3s}
.finish{display:grid;gap:12px;justify-items:center;text-align:center}
.finish>.emo{font-size:60px}
.rdv{display:flex;gap:12px;align-items:center;background:var(--saffron-soft);border-radius:18px;padding:12px 16px;text-align:left;width:100%}
.rdv .emo{font-size:30px}
.rdv b{display:block;font-size:16px}.rdv small{color:var(--muted);font-weight:700}
.ck2{display:flex;gap:10px;align-items:center;padding:6px 2px;font-weight:700;font-size:14px}
.ck2 input{width:22px;height:22px;accent-color:var(--olive)}
.ck2 small{color:var(--muted);font-weight:600;margin-left:auto}
.pickban{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--saffron-soft);border-radius:18px;padding:12px 14px;font-weight:800}


/* Liste en vignettes */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:12px;font-weight:800;color:var(--muted);background:var(--sunk);border-radius:99px;padding:3px 10px}
.lsec{display:grid;gap:10px}
.lsec h3{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:17px}
.lsec h3 .emo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-s);font-size:19px}
.lsec h3 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:800;margin-left:auto;background:var(--sunk);border-radius:99px;padding:2px 9px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
.lcard{position:relative;display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 6px 10px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-s);text-align:center;color:var(--ink);min-height:132px}
.lcard .lpic{width:58px;height:58px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:32px}
.lcard .lpic img{width:100%;height:100%;object-fit:cover}
.lcard .lq{position:absolute;top:8px;right:8px;background:var(--olive);color:var(--surface);font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .lk{position:absolute;top:8px;left:9px;font-family:var(--emoji);font-size:13px}
.lcard .ln{font-size:13px;font-weight:800;line-height:1.2}
.lcard .lnote{font-size:11px;font-weight:700;color:var(--sky);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard.done{opacity:.55}
.ihero{width:150px;height:150px;margin:0 auto;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:76px;box-shadow:var(--shadow-s)}
.ihero img{width:100%;height:100%;object-fit:cover}
.bigstep{grid-template-columns:44px minmax(64px,auto) 44px}
.bigstep button{font-size:22px;padding:8px}
.bigstep b{font-size:16px}
label.photo{cursor:pointer}
.bigemo{overflow:hidden}
.bigemo img{width:100%;height:100%;object-fit:cover}
.cnote{margin:4px 0 0;font-weight:800;color:var(--sky);font-size:16px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);border-radius:16px;padding:4px}
.seg2 button{border:0;border-radius:12px;padding:11px;background:transparent;font-size:15px}
.seg2 button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow-s)}
.seg2 b{background:var(--olive);color:var(--surface);border-radius:99px;padding:0 7px;font-size:12px}

/* v5 : calendrier, anti-oubli, commande en liste */
a.btn{text-decoration:none;text-align:center}
.quickacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quickacts button{display:grid;justify-items:center;gap:5px;padding:12px 4px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-s);font-size:12.5px;font-weight:800}
.quickacts .emo{font-size:24px}
.quick{display:flex;gap:8px;align-items:center}
.quick .search input{box-shadow:none;border:1.5px solid var(--line)}
.lwrap{position:relative}
.lwrap .lcard{width:100%}
.lcheck{position:absolute;left:6px;bottom:6px;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;font-size:14px;font-weight:900}
.lcheck.on{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.lcheck:not(.on):hover{color:var(--muted)}
.cmdhead{display:grid;gap:10px}
.ring.sm{width:62px;height:62px}.ring.sm>div{width:48px;height:48px}.ring.sm b{font-size:13px}
.crow{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.crow.done .n{text-decoration:line-through;color:var(--muted)}
.crow.done .cpic{opacity:.5}
.cb{width:34px;height:34px;padding:0;border-radius:10px;border:2px solid var(--olive);background:transparent;color:var(--surface);font-weight:900;font-size:16px}
.cb.on{background:var(--olive)}
.cpic{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:22px;overflow:hidden}
.cpic img{width:100%;height:100%;object-fit:cover}
.crow .cp{width:44px;height:40px;padding:0;font-size:17px}
.anti{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis>div{background:var(--sunk);border-radius:16px;padding:10px 12px}
.kpis b{display:block;font-family:var(--display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-weight:700;font-size:12px}
.kpis .warn{background:var(--saffron-soft)}
.pchk{display:flex;flex-wrap:wrap;gap:6px}
.pc{padding:7px 12px 7px 9px;border-radius:99px;font-size:13px;border-color:transparent;background:var(--sunk)}
.pc .emo{font-size:17px}
.pc.on{background:var(--olive);color:var(--surface)}
.secours{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--sky-soft);border-radius:16px;padding:12px}
.secours>.emo{font-size:26px}
.secours b{display:block}.secours small{color:var(--muted);font-weight:600;font-size:12.5px;line-height:1.3;display:block}
.secours.ok{background:var(--olive-soft)}
.verifs{display:grid;gap:6px}
.vf{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border-color:transparent;background:var(--sunk);font-size:14px;justify-content:stretch}
.vf .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--olive);display:grid;place-items:center;color:var(--surface);font-weight:900}
.vf.on .box{background:var(--olive)}
.vf.on{background:var(--olive-soft)}
.vf .emo{font-size:18px}

/* ===== Version simple ===== */
.band.kid{padding-block:14px 16px}
.band.kid::after{display:none}
.hb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hl{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.hplate{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:30px;background:var(--plate);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hl small{display:block;font-size:12.5px;font-weight:800;color:var(--saffron);letter-spacing:.02em}
.hl b{display:block;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hr{display:grid;justify-items:end;gap:6px}
.hr .sync{margin:0}
.gear{border:0;padding:0}
main.kidmain{margin-top:16px;gap:18px}
.hero2{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow-s)}
.hero2>.emo{font-size:44px;flex:none}
.hero2 h2{font-size:22px}
.hero2 p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:15px;line-height:1.35}
.hero2.center{flex-direction:column;text-align:center;padding:30px 18px}
.hero2 .emo.big{font-size:84px}
.ttl{font-size:24px}
.bigseg button{font-size:17px;padding:14px;font-weight:800}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.kgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.kt{position:relative}
.ktb{width:100%;display:grid;justify-items:center;align-content:start;gap:8px;padding:14px 6px 12px;border:3px solid transparent;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-s);min-height:118px;text-align:center;font-weight:800}
.ktb .emo{font-size:42px;line-height:1.1}
.ktb b{font-size:13.5px;line-height:1.2;font-weight:800}
.kt.on .ktb{border-color:var(--olive);background:var(--olive-soft)}
.kt.add .ktb{background:transparent;box-shadow:none;border:3px dashed var(--line)}
.badge{position:absolute;top:8px;right:8px;font-style:normal;background:var(--olive);color:var(--surface);font-size:12px;font-weight:900;border-radius:99px;padding:2px 8px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minus{position:absolute;top:-6px;left:-6px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--tomato);border-color:var(--tomato);color:#fff;font-size:22px;font-weight:900;line-height:1;box-shadow:var(--shadow-s)}
.eggs{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow-s)}
.eggs .emo{font-size:30px}.eggs b{flex:1;font-size:16px}
.eggs .stepper{grid-template-columns:44px 44px}.eggs .stepper button{font-size:22px;padding:6px}
.go{width:100%;padding:18px;font-size:18px;font-weight:900;border-radius:22px;border:0;background:var(--olive);color:var(--surface);box-shadow:0 6px 16px rgba(68,97,42,.3)}
.go.orange{background:var(--saffron);color:#2A1D05;box-shadow:0 6px 16px rgba(227,154,45,.35)}
.go:disabled{opacity:.4;box-shadow:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .go{font-size:16px;padding:16px 8px}
.meals{display:grid;gap:10px}
.meal{position:relative;border-radius:24px;box-shadow:var(--shadow-s)}
.meal.now{outline:4px solid var(--saffron);outline-offset:-4px}
.mb{width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;padding:12px 70px 12px 12px;border:0;background:transparent;border-radius:24px;justify-content:stretch;color:var(--ink)}
.mb .plate{--s:64px;grid-row:span 2;font-size:34px}
.mday{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;align-self:end}
.mname{font-size:16.5px;font-weight:800;line-height:1.2;align-self:start}
.swap{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:50px;height:50px;padding:0;border-radius:50%;font-size:22px;background:var(--surface);box-shadow:var(--shadow-s);border:0}
.swap:active{transform:translateY(-50%) rotate(90deg)}
.glab{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:-6px}
.glab .emo{font-size:22px}
.ck{position:relative}
.ckb{width:100%;display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 6px;border:3px solid transparent;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-s);min-height:128px;text-align:center}
.ckb .cpic{width:58px;height:58px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:34px}
.ckb .cpic img{width:100%;height:100%;object-fit:cover}
.ckb b{font-size:13.5px;font-weight:800;line-height:1.2}
.ckb small{font-size:11px;font-weight:800;color:var(--sky);line-height:1.2}
.ck.on .ckb{border-color:var(--olive);background:var(--olive-soft);opacity:.6}
.ck.on .ckb::after{content:"✓";position:absolute;top:44px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:var(--olive);color:#fff;font:900 24px var(--body);display:grid;place-items:center}
.ck.on .ckb b{text-decoration:line-through}
.more{position:absolute;bottom:6px;right:6px;width:30px;height:24px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;letter-spacing:1px}
.donebtn{justify-self:center;font-size:15px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:grid;justify-items:center;gap:8px;padding:18px 8px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-s);font-size:15px;font-weight:800;text-align:center}
.cat .emo{font-size:46px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:16px;padding:6px 0}
.setrow .stepper{grid-template-columns:42px 42px 42px}
.ihero{width:150px;height:150px;margin:0 auto;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-family:var(--emoji);font-size:80px;box-shadow:var(--shadow-s)}
.ihero img{width:100%;height:100%;object-fit:cover}
.bigstep{grid-template-columns:54px minmax(80px,auto) 54px}
.bigstep button{font-size:26px;padding:8px}.bigstep b{font-size:18px}
label.photo{cursor:pointer}
nav.tabs.kid{grid-template-columns:repeat(3,1fr)}
nav.tabs.kid a{font-size:13px;padding:8px 2px}
nav.tabs.kid a .ico{font-size:28px}
</style>

  sl.forEach(x=>{const r=keep(x)&&byId(plan[x.k]);if(r&&r.type){used.add(r.id);count[r.type]++;fec[r.fec]=(fec[r.fec]||0)+1;if(soup(r))soups++}});
  let cC=0;sl.forEach(x=>{const r=keep(x)&&byId(plan[x.k]);if(r&&r.type&&grade(r)==="C")cC++});
  const sc=sl.length/7;let prev=null,prevFec=null;
  for(const x of sl){
    if(keep(x)){const r=byId(plan[x.k]);prev=r?.type;prevFec=r?.fec;continue}
    let best=null,bs=-1e9;
    for(const r of pool){
      let v=Math.random()*3;
      if(used.has(r.id))v-=30; if(s.recent.includes(r.id))v-=5; if(isFav(r.id))v+=2.5; v+={A:1.5,B:.5,C:-1}[grade(r)]||0; if(grade(r)==="C"&&cC>=2)v-=4;
      if(r.saison&&r.saison!=="t"&&r.saison!==saison)v-=6;
      v+=panierHits(r).length*(x.i<=3?2.5:1.2);
      if([0,1,4,5,6].includes(x.i)&&x.label==="Soir"&&(r.min||30)>45)v-=5;
      if(x.i===0&&(r.min||30)>35)v-=3;
      const[mn,mx]=CIBLE[r.type]||[0,7],c=count[r.type]||0;
      if(c<mn*sc)v+=4;if(c>=mx*sc)v-=8;if(r.type===prev)v-=3.5;
      if(soup(r)&&soups>=1)v-=7;if(r.fec&&r.fec===prevFec)v-=2.5;if(r.fec&&(fec[r.fec]||0)>=2)v-=3;
      if(v>bs){bs=v;best=r}
    }
    plan[x.k]=best.id;used.add(best.id);if(grade(best)==="C")cC++;count[best.type]++;fec[best.fec]=(fec[best.fec]||0)+1;if(soup(best))soups++;prev=best.type;prevFec=best.fec;
  }
  return plan;
}
function bilan(){const c={vege:0,oeufs:0,poisson:0,volaille:0,viande:0};slots().forEach(x=>{const r=byId(S().plan[x.k]);if(r&&r.type)c[r.type]++});return c}

// ================= Liste de courses =================
function roundQ(q,u){if(u==="g")return Math.ceil(q/50)*50;if(u==="cl")return Math.ceil(q/10)*10;if(u==="kg"||u==="l")return Math.round(q*10)/10;return Math.max(1,Math.ceil(q-0.05))}
function fmtQ(q,u){if(q==null)return"";const big=u==="g"&&q>=1000;const uu=u==="pièce"?"":big?"kg":u;const qq=big?Math.round(q/100)/10:q;const pl=qq>1&&["boîte","botte","paquet","pack","bouteille"].includes(uu)?"s":"";return String(qq).replace(".",",")+(uu?" "+uu+pl:"")}
function liste(){
  const s=S(),f=F(),agg=new Map(),skip=new Set(),use={},qte=s.qte||{};
  const add=(n,q,u,src,kind)=>{const c=catFor(n),kk=key(n),cur=agg.get(kk)||{n:c?c.n:n,u:c?c.u:(u||""),q:0,hasQ:false,src:new Set(),recq:0,kinds:new Set()};
    if(q!=null){cur.q+=q;cur.hasQ=true;if(kind==="recette")cur.recq+=q}cur.src.add(src);cur.kinds.add(kind);agg.set(kk,cur)};
  slots().forEach(x=>{const r=byId(s.plan[x.k]);if(!r||!r.ingredients)return;const k=f.personnes/(r.portions||4);
    r.ingredients.forEach(i=>{if(inList(i.n,f.placard)||!catFor(i.n)&&i.q==null||catFor(i.n)&&i.q==null){skip.add(i.n);return}add(i.n,i.q*k,i.u,r.nom,"recette")})});
  f.essentiels.filter(e=>e.q>0).forEach(e=>add(e.n,e.q,null,"chaque semaine","ess"));
  (s.extras||[]).forEach(e=>add(e.n,e.q,e.u,"ajouté","ajout"));
  manque.forEach(m=>add(m.n,m.q,m.u,"ajouté","ajout"));
  for(const p of panier()){
    const entry=[...agg.entries()].find(([,it])=>!/oeuf/.test(norm(it.n))&&inList(it.n,[p.n]));const pk=key(p.n);
    if(!entry){use[pk]={recu:p.q,besoin:0};continue}
    const[kk,it]=entry;use[pk]={recu:p.q,besoin:it.recq||0};
    if(p.q==null||!it.hasQ||catFor(p.n)?.u!==it.u){agg.delete(kk);skip.add(it.n);continue}
    if(it.q<=p.q){agg.delete(kk);skip.add(it.n)}else{it.q-=p.q;it.note=`${fmtQ(p.q,it.u)} dans le panier bio`}
  }
  const eggs=agg.get(key("Œufs"));
  if(eggs&&eggs.hasQ){const need=Math.ceil(eggs.q)-(s.oeufsPanier||0);if(need<=0){agg.delete(key("Œufs"));skip.add("œufs")}else{eggs.q=need;eggs.note=`${s.oeufsPanier} dans le panier bio`}}
  const items=[],retires=[];
  for(const[kk,v]of agg){const c=catFor(v.n);let q=v.hasQ?roundQ(v.q,v.u):null;
    if(kk in qte){if(qte[kk]<=0){retires.push({id:kk,n:v.n});continue}q=qte[kk]}
    const why=v.kinds.has("recette")?"pour "+[...v.src].filter(x=>x!=="chaque semaine"&&x!=="ajouté").join(", "):v.kinds.has("ajout")?"ajouté à la main":"chaque semaine";
    items.push({id:kk,n:v.n,q,u:v.u,top:topOf(v.n),why,note:v.note,prix:c?cost(q??1,c.u,c.p):0,est:!!c,ess:v.kinds.has("ess"),manuel:v.kinds.has("ajout")})}
  const order=TOPS.map(t=>t[0]);
  items.sort((a,b)=>order.indexOf(a.top)-order.indexOf(b.top)||a.n.localeCompare(b.n,"fr"));
  return {items,retires,skip:[...skip],use,total:items.reduce((a,i)=>a+i.prix,0)};
}

const ORIG={fr:["Française","🥖"],ita:["Italienne","🍝"],asie:["Asiatique","🥢"],orient:["Orientale","🫖"],mex:["Mexicaine","🌮"],inde:["Indienne","🍛"],esp:["Espagnole","🥘"],usa:["Américaine","🍔"],monde:["Fusion","🌍"]};
const GRADE={A:["Très équilibré","g-A","🥗"],B:["Équilibré","g-B","🙂"],C:["Plaisir","g-C","🧁"]};
const HERBS=new Set(["ail","echalote","persil","coriandre","basilic","gingembre","citron"].map(key));
const CHEESE={"gruyere-rape":1,"parmesan":1,"comte":1,"feta":1,"ricotta":1,"mozzarella":125,"fromage-de-chevre":150,"reblochon":450};
const SCACHE=new Map();
function sante(r){
  const ck=r.id+"|"+(r.maj||"");if(SCACHE.has(ck))return SCACHE.get(ck);
  const ings=r.ingredients||[],pp=r.portions||4,why=[];let sc=0;
  const veg=ings.filter(i=>{const c=catFor(i.n);return c&&(c.r===0&&!HERBS.has(key(c.n))||/legumes-surgele|petits-pois/.test(key(c.n)))}).length;
  sc+=Math.min(veg,4);
  if(veg>=3)why.push(["🥕",`${veg} légumes différents`,1]);else if(veg<=1)why.push(["🥕","Peu de légumes : ajoutez une salade",-1]);
  if(ings.some(i=>/lentille|pois-chiche|haricots-rouge|haricots-blanc|pois-casse/.test(key(i.n)))){sc+=1.5;why.push(["🫘","Légumineuses : fibres et protéines",1])}
  if(r.type==="poisson"){sc+=2;why.push(["🐟","Poisson : riche en oméga-3",1])}
  else if(r.type==="vege"){sc+=1;why.push(["🌱","Sans viande",1])}
  else if(r.type==="volaille"){sc+=1;why.push(["🍗","Viande blanche, plus maigre",1])}
  else if(r.type==="oeufs"){sc+=.5;why.push(["🥚","Œufs : protéines complètes",1])}
  else if(r.type==="viande"){sc-=1;why.push(["🥩","Viande rouge ou porc : 2 fois par semaine maximum",-1])}
  let fro=0;ings.forEach(i=>{const m=CHEESE[key(i.n)];if(m&&i.q)fro+=i.q*m});fro/=pp;
  if(fro>50){sc-=1.5;why.push(["🧀","Riche en fromage",-1])}else if(fro>25)sc-=.5;
  const creme=ings.filter(i=>key(i.n)==="creme-fraiche").reduce((a,i)=>a+(i.q||0),0)/pp;if(creme>4){sc-=1;why.push(["🍶","Crème : à servir avec des légumes",-1])}
  if(ings.some(i=>/lardon|chorizo|saucisse|merguez/.test(key(i.n)))){sc-=1.5;why.push(["🥓","Charcuterie",-1])}
  if(ings.some(i=>/pate-brisee|pate-feuilletee|pate-a-pizza/.test(key(i.n)))){sc-=1;why.push(["🥧","Pâte à tarte ou à pizza",-1])}
  if(/frites/i.test(r.nom)&&r.app==="airfryer")why.push(["💨","Frites à l'Airfryer : 1 cuillère d'huile seulement",1]);
  const g=sc>=4?"A":sc>=1.5?"B":"C",res={sc,g,why};SCACHE.set(ck,res);return res;
}

function facOk(r){
  if(fac.temps){const m=r.min||30;if(fac.temps==="long"?m<=60:m>+fac.temps)return false}
  if(fac.grade&&grade(r)!==fac.grade)return false;
  if(fac.budget&&perPers(r)>+fac.budget)return false;
  for(const k of ["app","type","origine"])if(fac[k]&&r[k]!==fac[k])return false;

  if(fac.plus==="saison"&&!(r.saison===saisonNow()))return false;if(fac.plus==="panier"&&!panierHits(r).length)return false;

// ================= Connexion au serveur (Google Apps Script) =================
// ⚠️ Collez ici l'adresse de votre serveur Apps Script, et le même mot de passe que dans Code.gs
const API_URL = "https://script.google.com/macros/s/AKfycbwXyeIih7aA3IVx7NzQjWKHsn4cKsqpodvhptLrsZfKhkEDbpYScHLdkrDXaHyFiS8Q/exec";
const CLE = "CHANGEZ-MOI";

const SYNC = (()=>{
  const LS="menus-du-foyer-etat";
  let lastWrite=0,etat={semaine:null,foyer:null,recettes:{},manque:{},maj:0},pending=0,queue=Promise.resolve(),lastOk=0,online=true;
  const docL={semaine:[],foyer:[]},colL={recettes:[],manque:[]};
  try{const c=JSON.parse(localStorage.getItem(LS)||"null");if(c)etat=Object.assign(etat,c)}catch(_){}
  const configured=/^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL);
  const save=()=>{try{localStorage.setItem(LS,JSON.stringify(etat))}catch(_){}};
  const docSnap=n=>({exists:etat[n]!=null,data:()=>etat[n]});
  const colSnap=c=>({docs:Object.entries(etat[c]||{}).map(([id,d])=>({id,data:()=>d}))});
  function emit(){Object.keys(docL).forEach(n=>docL[n].forEach(f=>f(docSnap(n))));Object.keys(colL).forEach(c=>colL[c].forEach(f=>f(colSnap(c))));syncBadge()}
  function apply(e){if(e&&typeof e==="object"){etat=Object.assign({semaine:null,foyer:null,recettes:{},manque:{}},e);save()}}
  async function pull(){
    if(!configured||pending)return;
    const t0=Date.now();
    try{const r=await fetch(API_URL+"?cle="+encodeURIComponent(CLE)+"&t="+Date.now());const j=await r.json();
      if(j.erreur==="cle"){status("Mot de passe refusé par le serveur : vérifiez que CLE est le même dans index.html et dans Code.gs.");return}
      if(j.ok&&!pending&&t0>lastWrite&&(j.etat.maj||0)!==(etat.maj||0)){apply(j.etat);emit()}
      online=true;lastOk=Date.now();syncBadge()}
    catch(_){online=false;syncBadge()}
  }
  function send(body){
    pending++;syncBadge();
    queue=queue.then(async()=>{
      for(let essai=0;essai<3;essai++){
        try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({cle:CLE,...body})});
          const j=await r.json();if(j.erreur)throw new Error(j.erreur);
          lastWrite=Date.now();pending--;if(!pending){apply(j.etat);emit()}online=true;lastOk=Date.now();syncBadge();return}
        catch(err){if(err.message==="cle"){pending--;status("Mot de passe refusé par le serveur.");syncBadge();return}await new Promise(r=>setTimeout(r,1500*(essai+1)))}
      }
      pending--;online=false;syncBadge();status("Pas de connexion : la dernière modification n'a pas pu être enregistrée. Réessayez dans un instant.");
    });
    return queue;
  }
  const local=(fn)=>{fn();save();emit()};
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const db={
    doc(path){const[col,id]=path.split("/");const single=col==="semaine"?"semaine":col==="reglages"?"foyer":null;
      if(single)return{
        onSnapshot(f){docL[single].push(f);setTimeout(()=>f(docSnap(single)),0);return()=>{}},
        set(data){local(()=>etat[single]=data);return configured?send({action:"setDoc",nom:single,data}):Promise.resolve()},
        update(data){local(()=>etat[single]=Object.assign({},etat[single]||{},data));return configured?send({action:"patchDoc",nom:single,data}):Promise.resolve()}};
      return{
        set(data){local(()=>etat[col][id]=data);return configured?send({action:"putItem",col,id,data}):Promise.resolve()},
        update(data){local(()=>etat[col][id]=Object.assign({},etat[col][id]||{},data));return configured?send({action:"patchItem",col,id,data}):Promise.resolve()},
        delete(){local(()=>delete etat[col][id]);return configured?send({action:"delItem",col,id}):Promise.resolve()}};
    },
    collection(col){return{
      onSnapshot(f){colL[col].push(f);setTimeout(()=>f(colSnap(col)),0);return()=>{}},
      async add(data){const id=newId();await db.doc(col+"/"+id).set(data);return{id}}}}
  };
  function syncBadge(){const b=document.getElementById("sync");if(!b)return;
    if(!configured){b.textContent="⚙️ Serveur à relier";b.className="sync warn";return}
    if(pending){b.textContent="⏳ Enregistrement…";b.className="sync";return}
    if(!online){b.textContent="📴 Hors ligne";b.className="sync warn";return}
    b.textContent="✓ Synchronisé";b.className="sync ok"}
  if(configured){setInterval(()=>{if(document.visibilityState==="visible")pull()},8000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});window.addEventListener("focus",pull);pull()}
  return{db,configured,pull,syncBadge};
})();

    <button class="more" data-item="${esc(i.id)}" aria-label="Modifier ${esc(i.n)}">•••</button></div>`};
  const groups=TOPS.map(([id,n,e])=>({n,e,it:left.filter(i=>i.top===id)})).filter(g=>g.it.length);
  return `<section class="hero2"><span class="emo">🛒</span><div><h2>${left.length?`${left.length} chose${left.length>1?"s":""} à acheter`:L.items.length?"Tout est pris 🎉":"Rien à acheter"}</h2><p>${left.length?"Touche un produit quand il est dans le panier du drive.":"Ajoute ce qui manque avec le gros bouton."}</p></div></section>
  <div class="two"><button class="go orange" id="addProd">➕ Il manque…</button><button class="go" id="copyAll" ${left.length?"":"disabled"}>📋 Copier pour le drive</button></div>
  ${groups.map(g=>`<div class="glab"><span class="emo">${g.e}</span>${g.n}</div><div class="kgrid">${g.it.map(card).join("")}</div>`).join("")}
  ${done.length?`<button class="ghost donebtn" id="showDone">${showDone?"▲":"▼"} Déjà pris (${done.length})</button>${showDone?`<div class="kgrid">${done.map(card).join("")}</div>`:""}`:""}`;
}
function sheetItem(id){
  const it=liste().items.find(i=>i.id===id);if(!it){closeSheet();return}const p=prefOf(id);
  openSheet(`<div class="row spread"><span></span><button class="primary" data-close>Fini</button></div>
  <div class="ihero">${picOf(id,it.n)}</div><h2 class="big" style="text-align:center">${esc(it.n)}</h2>
  <div class="row" style="justify-content:center"><span class="stepper bigstep"><button data-q="${esc(id)}:-1:${esc(it.u||"")}:${it.q??1}" aria-label="Moins">−</button><b>${esc(fmtQ(it.q??1,it.u))}</b><button data-q="${esc(id)}:1:${esc(it.u||"")}:${it.q??1}" aria-label="Plus">+</button></span></div>
  <label class="btn soft big photo">📷 ${p.photo?"Changer la photo":"Prendre en photo le bon produit"}<input type="file" accept="image/*" data-photo="${esc(id)}" hidden></label>
  <input id="iNote" data-note="${esc(id)}" value="${esc(p.note||"")}" placeholder="✏️ Précision : marque, taille… (facultatif)">
  <button class="ghost" data-rm="${esc(id)}" style="color:var(--tomato)">🗑️ Enlever de la liste</button>`);
}
// Ajouter : rayon → sous-rayon → produit
function sheetAdd(mode){pick={top:null,sub:null,mode:mode||"ajout",q:""};drawAdd()}
function haveQty(n){const k=key(n);if(pick.mode==="ess"){const e=F().essentiels.find(x=>key(x.n)===k);return e?e.q:0}const m=manque.find(x=>key(x.n)===k);return m?m.q:0}
function prodTile(n){const c=catFor(n),q=haveQty(n);return `<div class="kt ${q?"on":""}"><button class="ktb" data-addp="${esc(n)}"><span class="emo">${c?c.e:"🛒"}</span><b>${esc(n)}</b>${q?`<i class="badge">${String(q).replace(".",",")}${c&&c.u==="g"?" g":""}</i>`:""}</button></div>`}
function drawAdd(){
  const T=pick.top!=null?TREE[pick.top]:null,Sb=T&&pick.sub!=null?T.subs[pick.sub]:null,q=norm(pick.q||"");let body="";
  if(q){const list=CAT.filter(c=>norm(c.n).includes(q)).slice(0,12);body=`<div class="kgrid">${list.map(c=>prodTile(c.n)).join("")}<div class="kt add"><button class="ktb" data-addp="${esc(pick.q.trim())}" data-free="1"><span class="emo">➕</span><b>${esc(pick.q.trim())}</b></button></div></div>`}
  else if(!T)body=`<div class="cats">${TREE.map((t,i)=>`<button class="cat" data-top="${i}"><span class="emo">${t.e}</span>${t.n}</button>`).join("")}</div>`;
  else if(!Sb)body=`<button class="ghost back" data-lvl="0">‹ Retour</button><div class="cats">${T.subs.map((x,i)=>`<button class="cat" data-sub="${i}"><span class="emo">${x.e}</span>${x.n}</button>`).join("")}</div>`;
  else body=`<button class="ghost back" data-lvl="1">‹ ${T.n}</button><div class="kgrid">${Sb.items.map(prodTile).join("")}</div>`;
  openSheet(`<div class="row spread"><h2>${pick.mode==="ess"?"⭐ Chaque semaine":Sb?Sb.e+" "+Sb.n:T?T.e+" "+T.n:"Il manque…"}</h2><button class="primary" data-close>Fini</button></div>
  <div class="search"><input id="addSearch" placeholder="Ou écris : café, piles…" value="${esc(pick.q||"")}" autocomplete="off"></div>${body}`);
  if(pick.focus){const i=$("#addSearch");i.focus();i.setSelectionRange(i.value.length,i.value.length);pick.focus=false}
}
async function addProduct(n,free){
  const c=free?null:catFor(n),name=c?c.n:n.charAt(0).toUpperCase()+n.slice(1),k=key(name),step=c?(c.u==="g"?500:c.u==="cl"?50:1):1;
  if(pick.mode==="ess"){const e=F().essentiels.map(x=>({...x})),ex=e.find(x=>key(x.n)===k);if(ex)ex.q+=1;else e.push({n:name,q:1});await saveFoyer({essentiels:e});return k}
  const ex=manque.find(x=>key(x.n)===k);
  try{if(ex)await db.doc("manque/"+ex.id).update({q:(ex.q||0)+step});else await db.collection("manque").add({n:name,q:step,u:c?c.u:"",ajoute:new Date().toISOString()});
    const s=S(),qte={...(s.qte||{})},co={...s.coches};let ch=false;if(k in qte){delete qte[k];ch=true}if(co[k]){delete co[k];ch=true}if(ch)saveSemaine({qte,coches:co});
    toast(`✓ ${name}`)}catch(e){denied(e)}
  return k;
}
function driveText(items){return TOPS.map(([id,n])=>{const a=items.filter(i=>i.top===id);return a.length?n.toUpperCase()+"\n"+a.map(i=>`• ${i.n}${i.q!=null?" — "+fmtQ(i.q,i.u):""}${prefOf(i.id).note?` (${prefOf(i.id).note})`:""}`).join("\n"):""}).filter(Boolean).join("\n\n")}
async function copyOrShow(txt,ok){try{await navigator.clipboard.writeText(txt);toast(ok)}catch(_){openSheet(`<div class="row spread"><h2>📋 La liste</h2><button class="primary" data-close>Fini</button></div><textarea readonly style="min-height:300px" onfocus="this.select()">${esc(txt)}</textarea><p class="hint">Reste appuyé dans le texte, puis « Tout sélectionner » et « Copier ».</p>`)}}

// ---------- ⚙️ Réglages (caché) ----------
function sheetSet(){const f=F(),s=S();
  openSheet(`<div class="row spread"><h2>⚙️ Réglages</h2><button class="primary" data-close>Fini</button></div>
  <div class="setrow"><span>👨‍👩‍👧‍👦 Personnes</span><span class="stepper"><button data-pers="-1">−</button><b>${f.personnes}</b><button data-pers="1">+</button></span></div>
  <div class="setrow"><span>☀️ Midis du week-end</span><button class="${f.repas==="we"?"primary":"soft"}" id="toggleWe">${f.repas==="we"?"Oui":"Non"}</button></div>
  <div class="lab">⭐ Ajouté tout seul chaque semaine</div>
  <div class="kgrid">${f.essentiels.map((e,ix)=>`<div class="kt ${e.q?"on":""}"><button class="ktb" data-ess="${ix}:1"><span class="emo">${emojiFor(e.n)}</span><b>${esc(e.n)}</b>${e.q?`<i class="badge">${e.q}</i>`:""}</button>${e.q?`<button class="minus" data-ess="${ix}:-1">−</button>`:""}</div>`).join("")}
    <div class="kt add"><button class="ktb" id="essAdd"><span class="emo">➕</span><b>Ajouter</b></button></div></div>
  <button class="soft big" id="newR">✍️ Ajouter une recette à nous</button>
  <button class="ghost" id="resetWeek">🔄 Recommencer la semaine (vide panier, repas et coches)</button>
  <p class="hint">La semaine repart toute seule chaque jeudi. Ce qui n'a pas été acheté reste sur la liste.</p>`)}

// ---------- Nouvelle semaine automatique ----------
let autoDone=false;
function autoWeek(){if(autoDone||!loaded)return;autoDone=true;const s=S();if(s.debut>=iso(lastThursday())||!semaine)return;resetWeek(true)}
function resetWeek(auto){const s=S(),recent=[...Object.values(s.plan),...s.recent].filter(x=>x&&x!=="restes").slice(0,14);
  manque.filter(m=>s.coches[key(m.n)]).forEach(m=>db&&db.doc("manque/"+m.id).delete().catch(()=>{}));
  saveSemaine({debut:iso(lastThursday()),panier:[],plan:{},verrous:{},coches:{},qte:{},extras:[],recent});if(!auto)toast("Nouvelle semaine 🌱");view="panier";location.hash="panier"}

// ================= Événements =================
let tickLock={};
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-open]");if(!t)return;const d=t.dataset,s=S();
  if(d.close!=null){closeSheet();return}
  if(d.tabGo){location.hash=d.tabGo;return}
  if(t.id==="openSet"){sheetSet();return}
  // panier
  if(d.pgrp){panGrp=d.pgrp;render();return}
  if(d.pan!=null){const p=panier(),it=p.find(x=>key(x.n)===key(d.pan));if(it){it.q=Math.round(((it.q||0)+panStep(d.pan))*10)/10}else p.push({n:d.pan,q:panDefault(d.pan)});await saveSemaine({panier:p});if($("#sheet").open&&$("#panSearch"))sheetPanMore($("#panSearch").value);return}
  if(d.panminus!=null){const p=panier(),it=p.find(x=>key(x.n)===key(d.panminus));if(!it)return;it.q=Math.round(((it.q||0)-panStep(d.panminus))*10)/10;if(!(it.q>0))p.splice(p.indexOf(it),1);await saveSemaine({panier:p});if($("#sheet").open&&$("#panSearch"))sheetPanMore($("#panSearch").value);return}
  if(t.id==="panMore"){sheetPanMore("");return}
  if(d.eggs){saveSemaine({oeufsPanier:Math.max(0,s.oeufsPanier+(+d.eggs))});return}
  if(t.id==="panDone"){await saveSemaine({panierOk:true,plan:genere()});location.hash="repas";toast("✨ Voilà les repas !");return}
  // repas
  if(t.id==="gen"){await saveSemaine({plan:genere()});toast("✨ Nouveaux repas");return}
  if(d.swap){const k=d.swap,p=genere(k);await saveSemaine({plan:{...S().plan,[k]:p[k]}});if(d.keep)sheetRecette(byId(p[k]),k);return}
  if(d.open){const k=Object.keys(s.plan).find(x=>s.plan[x]===d.open);sheetRecette(byId(d.open),k||null);return}
  if(d.setday){saveSemaine({plan:{...s.plan,[d.setday]:d.rid}});closeSheet();toast("✓ C'est noté");return}
  // courses
  if(d.tick){if(tickLock[d.tick]&&Date.now()-tickLock[d.tick]<600)return;tickLock[d.tick]=Date.now();const co={...s.coches};if(co[d.tick])delete co[d.tick];else co[d.tick]=true;saveSemaine({coches:co});return}
  if(t.id==="showDone"){showDone=!showDone;render();return}
  if(d.item){sheetItem(d.item);return}
  if(t.id==="addProd"){sheetAdd("ajout");return}
  if(t.id==="copyAll"){const rest=liste().items.filter(i=>!s.coches[i.id]);await copyOrShow(driveText(rest),`📋 ${rest.length} produits copiés`);return}
  if(d.top!=null){pick.top=+d.top;pick.sub=null;drawAdd();return}
  if(d.sub!=null){pick.sub=+d.sub;drawAdd();return}
  if(d.lvl!=null){if(d.lvl==="0")pick.top=null;pick.sub=null;drawAdd();return}
  if(d.addp){const k=await addProduct(d.addp,!!d.free);if(d.free&&pick.mode!=="ess"){pick.q="";closeSheet();setTimeout(()=>sheetItem(k),150);return}drawAdd();return}
  if(d.q){const[id,dl,u,cur]=d.q.split(":");const qte={...(s.qte||{})};let v=Math.round(((+cur)+(+dl)*stepOf(u))*100)/100;if(v<0)v=0;qte[id]=v;
    if(v<=0){const m=manque.find(x=>key(x.n)===id);if(m&&db)db.doc("manque/"+m.id).delete().catch(()=>{});closeSheet()}await saveSemaine({qte});if(v>0)sheetItem(id);else toast("Enlevé");return}
  if(d.rm){const qte={...(s.qte||{}),[d.rm]:0};const m=manque.find(x=>key(x.n)===d.rm);if(m&&db)db.doc("manque/"+m.id).delete().catch(()=>{});closeSheet();saveSemaine({qte});toast("Enlevé");return}
  // réglages
  if(d.pers){saveFoyer({personnes:Math.min(12,Math.max(1,F().personnes+(+d.pers)))});sheetSet();return}
  if(t.id==="toggleWe"){await saveFoyer({repas:F().repas==="we"?"soir":"we"});sheetSet();return}
  if(d.ess){const[ix,dl]=d.ess.split(":").map(Number);const es=F().essentiels.map(x=>({...x}));es[ix].q=Math.max(0,es[ix].q+dl);await saveFoyer({essentiels:es});sheetSet();return}
  if(t.id==="essAdd"){sheetAdd("ess");return}
  if(t.id==="resetWeek"){if(d.confirm!=="1"){d.confirm="1";t.textContent="Touche encore pour confirmer";return}closeSheet();resetWeek(false);return}
  // recettes perso
  if(t.id==="newR"){sheetEdit(null);return}
  if(d.editr){sheetEdit(byId(d.editr));return}
  if(d.ricon){draft.icone=d.ricon;drawIcons();return}
  if(d.rtype){draft.type=d.rtype;drawSeg();return}
  if(d.rapp){draft.app=d.rapp;drawSeg();return}
  if(d.rmin){draft.min=Math.min(240,Math.max(5,draft.min+(+d.rmin)));$("#rMin").textContent=draft.min+" min";return}
  if(d.rp){draft.portions=Math.min(12,Math.max(1,draft.portions+(+d.rp)));$("#rPort").textContent=draft.portions;return}
  if(d.iadd){toggleIng(d.iadd);return}
  if(d.icustom){toggleIng(d.icustom);$("#rSearch").value="";drawCat("");return}
  if(d.irm!=null){draft.ingredients.splice(+d.irm,1);drawSel();drawCat($("#rSearch").value);return}
  if(t.id==="rSave"){saveRecipe();return}
  if(t.id==="rDel"){if(d.confirm!=="1"){d.confirm="1";t.textContent="Confirmer la suppression";return}closeSheet();if(db&&draft.id)try{await db.doc("recettes/"+draft.id).delete();toast("Recette supprimée")}catch(err){denied(err)}return}
});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset?.note!=null){await savePref(t.dataset.note,{note:t.value.trim()});toast("✓ Noté");return}
  if(t.dataset?.photo!=null&&t.files&&t.files[0]){const id=t.dataset.photo;toast("📷 …");try{await savePref(id,{photo:await compress(t.files[0])});toast("📷 Photo gardée");sheetItem(id)}catch(_){toast("Impossible de lire cette photo")}}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(t.id==="addSearch"){pick.q=t.value;pick.focus=true;drawAdd()}
  if(t.id==="panSearch")sheetPanMore(t.value);
  if(t.id==="recSearch"){$("#recRes").innerHTML=recTiles(d.k,t.value)}
  if(t.id==="rSearch")drawCat(t.value);
  if(d.iq!=null)draft.ingredients[+d.iq].q=t.value===""?null:+t.value});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target,v=t.value?.trim();
  if(t.id==="addSearch"&&v){e.preventDefault();const c=CAT.find(c=>norm(c.n)===norm(v))||CAT.find(c=>norm(c.n).includes(norm(v)));addProduct(c?c.n:v,!c).then(k=>{pick.q="";if(!c&&pick.mode!=="ess"){closeSheet();setTimeout(()=>sheetItem(k),150);return}pick.focus=true;drawAdd()})}
  if(t.id==="rSearch"&&v){e.preventDefault();const c=CAT.find(c=>norm(c.n).includes(norm(v)));toggleIng(c?c.n:v);t.value="";drawCat("")}});
$("#sheet").addEventListener("close",()=>render());

function route(){const h=location.hash.slice(1);view=VIEWS.includes(h)?h:(new Date().getDay()===4&&!S().panierOk?"panier":"repas");render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
route();
(async()=>{
  db=SYNC.db;
  if(!SYNC.configured)status("Le serveur n'est pas encore relié : l'appli marche, mais seulement sur ce téléphone.");
  const err=()=>status("Synchronisation interrompue, recharge la page.");
  const got={r:0,s:0,f:0},ready=()=>{if(got.r&&got.s&&got.f&&!loaded){loaded=true;autoWeek();route();return}render()};
  db.collection("recettes").onSnapshot(q=>{perso=q.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!r.exemple&&r.nom).map(r=>({app:"poele",min:30,saison:"t",fec:"",steps:[],origine:"fr",kids:false,reheat:false,...r,builtin:false}));got.r=1;ready()},err);
  db.doc("semaine/courante").onSnapshot(d=>{semaine=d.exists?d.data():null;got.s=1;ready()},err);
  db.doc("reglages/foyer").onSnapshot(d=>{foyer=d.exists?d.data():null;got.f=1;ready()},err);
  db.collection("manque").onSnapshot(q=>{manque=q.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.n);if(!$("#sheet").open)render();else if($("#addSearch")&&document.activeElement?.id!=="addSearch")drawAdd()},err);
})();

</script>
</body>
</html>
